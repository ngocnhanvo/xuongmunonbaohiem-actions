name: Blue Sea Google services production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-services-production-smoke.yml'
      - 'requests/google-services-production-smoke.txt'
permissions:
  contents: read
jobs:
  production-tracking-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch live production HTML
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --connect-timeout 12 --max-time 30 -fsSL \
              -H 'Cache-Control: no-cache' \
              'https://xuongmunonbaohiem.io.vn/' -o /tmp/blue-sea-google.html; then
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep 5
          done
      - name: Confirm verified IDs in live HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/blue-sea-google.html").read_text(encoding="utf-8", errors="replace")
          required = [
              'name="google-site-verification"',
              '7ILd_ZudXdnxF7eFLtjwZ5yBTUHk5rymPMcDrokxR2M',
              'name="ahrefs-site-verification"',
              '4384582f84934f7b090c4795f8f4703d495f1c97c78a5e81f0d8e8e5993364bf',
              'GTM-N4QNX8C',
              'G-2DN8TB4G2D',
              'AW-377492534',
              'googletagmanager.com/gtm.js',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit("FAIL: tracking identifiers missing from live production HTML: " + ", ".join(missing))
          print("PASS: all expected Google + Ahrefs IDs are present in production HTML")
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("Google/Ahrefs markup delivered on xuongmunonbaohiem.io.vn: PASS.\n")
              f.write("Note: GTM Preview and GA4 Realtime are still required to confirm real event ingestion.\n")
          PY
