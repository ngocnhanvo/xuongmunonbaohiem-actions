name: Blue Sea Product H1 Production Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-h1-live-smoke.yml'
permissions:
  contents: read
concurrency:
  group: blue-sea-product-h1-live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Confirm product page H1 matches imported exact legacy value
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,html,urllib.request,time,os
          from html.parser import HTMLParser

          class Headings(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth=0
                  self.parts=[]
                  self.found=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='h1' and self.depth==0:
                      self.depth=1
                      self.parts=[]
                  elif self.depth: self.depth+=1
              def handle_endtag(self, tag):
                  if self.depth:
                      self.depth-=1
                      if self.depth==0:
                          self.found.append(' '.join(''.join(self.parts).split()))
                          self.parts=[]
              def handle_data(self, data):
                  if self.depth: self.parts.append(data)

          products=json.load(open('reports/product-h1-verified-candidates.json',encoding='utf8'))['products']
          cases=['non-bao-hiem-2-ban-chan-acvina',
                 'non-bao-hiem-2-ban-chan-vietinbank-kien-giang',
                 'non-bao-hiem-honda-tien-thanh-mau-1']
          expected={p['slug']:p['seo_h1'] for p in products if p['slug'] in cases}
          if len(expected)!=len(cases): raise SystemExit('Missing product in source manifest')
          pending=dict(expected)
          for attempt in range(1,11):
              next_pending={}
              for slug,h1 in pending.items():
                  url='https://xuongmunonbaohiem.io.vn/san-pham/'+slug
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'ESC-H1-Production-Smoke/1.0'})
                      with urllib.request.urlopen(request,timeout=22) as response:
                          if response.status!=200: raise Exception('HTTP '+str(response.status))
                          parser=Headings()
                          parser.feed(response.read().decode('utf-8','replace'))
                          actual=[html.unescape(x) for x in parser.found]
                          if actual.count(h1)!=1: raise Exception('H1 mismatch, headings='+str(actual[:2]))
                          print('PASS '+slug+': '+h1)
                  except Exception as e:
                      print('Attempt '+str(attempt)+': '+slug+' pending: '+str(e)[:180])
                      next_pending[slug]=h1
              if not next_pending:
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                      f.write('PASS: Production HTML H1 equals exactly the verified original .com text for ACVINA, VietinBank and Honda Tiến Thành.\n')
                  break
              if attempt==10: raise SystemExit('Production H1 not yet correct for: '+str(list(next_pending)))
              pending=next_pending
              time.sleep(5)
          PY

# One-time verification after isolated Astro master H1 whitespace hotfix c5890120a42f90d92472428667d55583fa1ac334
