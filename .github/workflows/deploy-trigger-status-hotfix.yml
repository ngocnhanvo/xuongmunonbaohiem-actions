name: Deploy GitHub Trigger UI Fix (2 Files)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xuongmunonbaohiem-actions-wordpress-trigger-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve WordPress production destination
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=[]
          for line in os.environ.get('ENV_FILE','').splitlines():
            line=line.strip().removeprefix('export ').strip()
            if line.startswith('WC_URL='):vals.append(line.split('=',1)[1].strip().strip("\"'"))
          if len(vals)!=1:raise SystemExit('Missing or ambiguous WC_URL')
          u=urlsplit(vals[0]);host=(u.hostname or '').lower()
          if (u.scheme!='https' or not re.fullmatch(r'[a-z0-9.-]+',host)
            or '.' not in host or '..' in host or u.username or u.password
            or u.port not in (None,443) or u.path not in ('','/') or u.query or u.fragment):
            raise SystemExit('Invalid backend WC_URL')
          with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('WORDPRESS_ORIGIN=https://'+host+'\n')
            output.write('TRIGGER_FTP_DIR=/domains/'+host+'/public_html/wp-content/plugins/github-trigger\n')
          print('Production backend:',host)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: PHP JS and trigger regression tests before upload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "5d5608f51f3ab822af32cdc1f63587f8f87af062"
          d=source/wp-content/plugins/github-trigger
          php -l "$d/vcs-build-trigger.php"
          php "$d/tests/build-status-regression.php"
          node --check "$d/vcs-build-trigger.js"
          grep -Fq "'1.2.3'" "$d/vcs-build-trigger.php"
          echo 'TRIGGER_PREDEPLOY_REGRESSION_PASS'
      - name: Prepare FTP client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lftp >/dev/null 2>&1; then
            if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lftp; then
              sudo apt-get update -qq
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lftp
            fi
          fi
      - name: Upload exactly two trigger files and compare FTP bytes
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$TRIGGER_FTP_DIR"
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) exit 1 ;; esac
          src=source/wp-content/plugins/github-trigger
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$protocol://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 25
          set ftp:passive-mode yes
          set ssl:verify-certificate no
          cd "$TRIGGER_FTP_DIR"
          get vcs-build-trigger.php -o "$RUNNER_TEMP/trigger-original.php"
          get vcs-build-trigger.js -o "$RUNNER_TEMP/trigger-original.js"
          put "$src/vcs-build-trigger.js" -o vcs-build-trigger.js
          put "$src/vcs-build-trigger.php" -o vcs-build-trigger.php
          get vcs-build-trigger.php -o "$RUNNER_TEMP/trigger-live.php"
          get vcs-build-trigger.js -o "$RUNNER_TEMP/trigger-live.js"
          bye
          LFTP
          cmp "$src/vcs-build-trigger.php" "$RUNNER_TEMP/trigger-live.php"
          cmp "$src/vcs-build-trigger.js" "$RUNNER_TEMP/trigger-live.js"
          php -l "$RUNNER_TEMP/trigger-live.php"
          node --check "$RUNNER_TEMP/trigger-live.js"
          echo 'TRIGGER_FTP_BYTE_MATCH_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: WordPress REST and authenticated Build page smoke (read-only)
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.parse,http.cookiejar
          root=os.environ['WORDPRESS_ORIGIN']
          def fetch(url,op=urllib.request):
            with (urllib.request.urlopen if op is urllib.request else op.open)(urllib.request.Request(url,headers={'User-Agent':'BlueSea-Trigger-QA','Cache-Control':'no-cache'}),timeout=40) as response:
              return response.read().decode('utf8','replace'),response.geturl()
          rest,_=fetch(root+'/wp-json/')
          if '"name"' not in rest: raise RuntimeError('WordPress REST unavailable')
          js,_=fetch(root+'/wp-content/plugins/github-trigger/vcs-build-trigger.js?qa=20261015')
          if 'syncLastBuildSummary' not in js:raise RuntimeError('Production JS outdated')
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          op.open(root+'/wp-login.php',timeout=40).read()
          data=urllib.parse.urlencode({'log':os.environ['WP_ADMIN_USERNAME'],
            'pwd':os.environ['WP_ADMIN_PASSWORD'],'wp-submit':'Log In',
            'redirect_to':root+'/wp-admin/admin.php?page=vcs-build-trigger',
            'testcookie':'1'}).encode()
          op.open(urllib.request.Request(root+'/wp-login.php',data=data),timeout=40).read()
          page,dest=fetch(root+'/wp-admin/admin.php?page=vcs-build-trigger',op)
          if 'wp-login.php' in dest or 'vcs-last-build-summary' not in page or 'vcs-build-trigger.js?ver=1.2.3' not in page:
            raise RuntimeError('Authenticated Build page missing updated PHP/JS version')
          print('TRIGGER_PRODUCTION_AUTH_UI_PASS')
          PY
