name: Chrome QA - ESC Builder Schema Matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/esc-builder-items-schema-matrix.yml']
permissions:
  contents: read
concurrency:
  group: blue-sea-builder-schema-matrix
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "): line=line[7:].strip()
              if line.startswith("WC_URL="):
                  v=line.split("=",1)[1].strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ("'",'"'):v=v[1:-1]
                  vals.append(v)
          if len(vals)!=1:raise SystemExit("Missing or duplicate WC_URL in ENV_FILE")
          parsed=urlsplit(vals[0]);host=(parsed.hostname or "").lower()
          if (parsed.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
              or "." not in host or ".." in host or parsed.username or parsed.password
              or parsed.port not in (None,443) or parsed.path not in ("","/")
              or parsed.query or parsed.fragment):raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as f:
              f.write("WC_URL=https://"+host+"\n")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify each Page 248 ESC Table item schema with no content writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          for(const key of ['WC_URL','WP_ADMIN_USERNAME','WP_ADMIN_PASSWORD','CHROME_PATH'])
            if(!process.env[key])throw Error('Missing '+key);
          const wp=new URL(process.env.WC_URL).origin;
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,
            headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const result={page:248,total:0,editable:[],blocked:[],writeAttempts:0,iframeStable:false};
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1510,height:960});
            await page.setRequestInterception(true);
            page.on('request',r=>{
              const route=new URL(r.url()).pathname;
              if(r.method()==='POST'&&/\/esc-builder\/v1\/(?:insert-item|save-section-order|save-text|save-image|save-page-text|save-page-image)\/?$/.test(route)){
                result.writeAttempts++;
                r.abort('blockedbyclient');
              }else r.continue();
            });
            await page.goto(wp+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:60000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('/wp-login.php'))throw Error('WordPress login failed');
            await page.goto(wp+'/wp-admin/edit.php?post_type=page&page=esc-visual-builder&esc_vb_page=248',
              {waitUntil:'domcontentloaded',timeout:70000});
            const element=await page.waitForSelector('#esc-vb-frame',{timeout:25000});
            const frame=await element.contentFrame();
            if(!frame)throw Error('Missing iframe');
            await frame.waitForSelector('[data-tablepress-preview="home_00"]',{timeout:60000});
            const originalUrl=frame.url();
            const ids=await frame.$$eval('[data-tablepress-preview]',nodes=>[
              ...new Set(nodes.map(n=>n.getAttribute('data-tablepress-preview')).filter(Boolean))
            ]);
            if(ids.length!==14)throw Error('Homepage ESC Table count changed: '+ids.length);
            result.total=ids.length;
            for(const id of ids){
              // Select the ESC Table without following links inside visual sections.
              await frame.$eval('[data-tablepress-preview="'+id+'"]',node=>{
                node.addEventListener('click',event=>event.preventDefault(),
                  {capture:true,once:true});
                node.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
              });
              await page.waitForFunction(id=>
                document.getElementById('esc-vb-item-panel')?.hidden===false &&
                (document.getElementById('esc-vb-item-context')?.textContent||'').startsWith(id),
                {timeout:12000},id);
              const schemaPromise=page.waitForResponse(r=>
                r.request().method()==='POST'&&
                /\/esc-builder\/v1\/item-schema\/?$/.test(new URL(r.url()).pathname),
                {timeout:25000});
              await page.click('#esc-vb-item-new');
              const response=await schemaPromise;
              const schema=await response.json().catch(()=>({}));
              if(!response.ok||schema?.code||schema?.can_add===false){
                await page.waitForFunction(()=>Boolean(
                  document.getElementById('esc-vb-item-status')?.textContent?.trim()),
                  {timeout:10000});
                if(await page.$eval('#esc-vb-item-dialog',e=>e.open))
                  throw Error(id+': blocked source unexpectedly editable');
                result.blocked.push({table:id,code:String(schema?.code||'limit_or_unsupported')});
                continue;
              }
              if(schema.table_id!==id||!Array.isArray(schema.fields)||
                 !Array.isArray(schema.items)||schema.count!==schema.items.length)
                throw Error(id+': invalid REST schema');
              await page.waitForFunction(()=>
                document.getElementById('esc-vb-item-dialog')?.open===true,{timeout:15000});
              const controls=await page.evaluate(()=>[
                ...document.querySelectorAll('#esc-vb-item-fields > .esc-vb-item-field')
              ].map(el=>({
                field:el.querySelector('[data-esc-item-field]')?.dataset.escItemField||null,
                media:!![...el.querySelectorAll('button')].find(b=>
                  b.textContent.includes('Media Library')),
                alt:!!el.querySelector('input[placeholder="Alt hình ảnh"]'),
                readonly:!!el.querySelector('input[readonly]')
              })));
              if(controls.length!==schema.fields.length)
                throw Error(id+': mismatched UI field count');
              for(let i=0;i<schema.fields.length;i++){
                const f=schema.fields[i],ctrl=controls[i];
                if(f.type==='image'&&(!ctrl.media||!ctrl.alt))
                  throw Error(id+': missing Media + Alt for '+f.name);
                if(f.type!=='image'&&ctrl.field!==f.name)
                  throw Error(id+': missing input '+f.name);
                if(f.type==='readonly'&&!ctrl.readonly)
                  throw Error(id+': unprotected HTML '+f.name);
              }
              result.editable.push({table:id,count:schema.count,fields:schema.fields.map(f=>f.name+':'+f.type)});
              await page.click('#esc-vb-item-dismiss');
              await page.waitForFunction(()=>!document.getElementById('esc-vb-item-dialog')?.open,
                {timeout:8000});
            }
            result.iframeStable=frame.url()===originalUrl;
            console.log('SCHEMA_MATRIX_END='+JSON.stringify({
              total:result.total,editable:result.editable.map(x=>x.table),
              blocked:result.blocked,writeAttempts:result.writeAttempts,
              iframeStable:result.iframeStable,
              originalPath:new URL(originalUrl).pathname,
              currentPath:new URL(frame.url()).pathname
            }));
            if(!result.iframeStable||result.writeAttempts)
              throw Error('Iframe reloaded or content-write attempted');
            for(const id of ['home_00','home_01'])
              if(!result.editable.some(x=>x.table===id))throw Error('Required popup unavailable: '+id);
            if(!result.blocked.some(x=>x.table==='home_02'))
              throw Error('Non-repeater home_02 not blocked');
            console.log('ESC_BUILDER_SCHEMA_MATRIX_PASS='+JSON.stringify(result));
          }finally{await browser.close();}
          JS
