name: Update ESC Table Preview Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'missing = only tables without preview; single/selected = chosen shortcode IDs'
        required: true
        default: missing
        type: choice
        options:
          - missing
          - single
          - selected
      shortcodes:
        description: 'Comma/newline separated ESC Table IDs, e.g. home_00,home_03'
        required: false
        default: ''
        type: string
      force:
        description: 'Replace an existing preview image'
        required: false
        default: false
        type: boolean
      page_url:
        description: 'Optional production page URL override for the selected IDs'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'requests/tablepress-previews.txt'

concurrency:
  group: xuongmunonbaohiem-actions-tablepress-previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve WC_URL from ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          vals = []
          for line in os.environ.get("ENV_FILE", "").splitlines():
              line = line.strip()
              if line.startswith("export "): line = line[7:].strip()
              if line.startswith("WC_URL="):
                  v = line.split("=", 1)[1].strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'): v = v[1:-1]
                  vals.append(v)
          if len(vals) != 1: raise SystemExit("Missing or duplicate WC_URL in ENV_FILE")
          url = urlsplit(vals[0])
          host = (url.hostname or "").lower()
          if (url.scheme != "https" or not re.fullmatch(r"[a-z0-9.-]+", host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None, 443) or url.path not in ("", "/")
                  or url.query or url.fragment):
              raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("WC_URL=https://" + host + "\n")
          print("Backend host:", host)
          PY
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$WC_URL"
          test -n "$WP_ADMIN_USERNAME"
          test -n "$WP_ADMIN_PASSWORD"

      - name: Checkout private Blue Sea PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate preview automation source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check automation/tablepress/previews.mjs
          grep -Fq 'https://xuongmunonbaohiem.io.vn' automation/tablepress/previews.mjs

      - name: Install browser and image tools
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Capture and publish ESC Table previews
        working-directory: source
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          TABLEPRESS_PUBLIC_ORIGIN: https://xuongmunonbaohiem.io.vn
          TABLEPRESS_PREVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'missing' }}
          TABLEPRESS_SHORTCODES: ${{ github.event_name == 'workflow_dispatch' && inputs.shortcodes || 'home_00,home_01,home_02,home_03,home_04,home_05,home_06,home_07,home_08,home_09,home_10,home_11,home_12,home_13,contact_00' }}
          TABLEPRESS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          TABLEPRESS_PAGE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.page_url || '' }}
        run: node automation/tablepress/previews.mjs

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablepress-previews
          path: source/tablepress-previews/
          if-no-files-found: ignore
          retention-days: 3
