name: ESC Builder Source Contract QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/esc-builder-source-contract.txt'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Test authenticated WordPress source contract
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import os,requests
          from urllib.parse import urlparse,parse_qs
          from bs4 import BeautifulSoup
          root=os.environ['WP_ADMIN_URL'].split('/wp-admin')[0].rstrip('/')
          session=requests.Session()
          session.get(root+'/wp-login.php',timeout=30)
          session.post(root+'/wp-login.php',data={
            'log':os.environ['WP_ADMIN_USERNAME'],
            'pwd':os.environ['WP_ADMIN_PASSWORD'],
            'wp-submit':'Log In',
            'redirect_to':root+'/wp-admin/admin.php?page=esc-visual-builder',
            'testcookie':'1'
          },timeout=40,allow_redirects=True)
          page=session.get(root+'/wp-admin/admin.php?page=esc-visual-builder',timeout=40)
          if 'wp-login.php' in page.url or page.status_code!=200:
            raise SystemExit('WP admin login or Builder page HTTP error: '+str(page.status_code))
          iframe=BeautifulSoup(page.text,'html.parser').select_one('#esc-vb-frame')
          if not iframe: raise SystemExit('Missing Builder iframe')
          src=iframe.get('src')
          params=parse_qs(urlparse(src).query)
          ticket=params.get('ticket',[''])[0]
          page_id=int(urlparse(src).path.rstrip('/').split('/')[-1])
          if len(ticket)!=64: raise SystemExit('Invalid Builder preview ticket')
          verify=session.post(root+'/wp-json/esc-builder/v1/changes',json={
            'ticket':ticket,'page_id':page_id,'since':0
          },timeout=35)
          if verify.status_code!=200:
            raise SystemExit('Builder changes metadata contract HTTP '+str(verify.status_code))
          data=verify.json()
          if not isinstance(data.get('changes'),list) or not isinstance(data.get('pending'),list):
            raise SystemExit('Invalid changes revision schema')
          state=session.post(root+'/wp-json/esc-builder/v1/page-state',json={
            'ticket':ticket,'page_id':page_id
          },timeout=35)
          if state.status_code!=200:
            raise SystemExit('Builder page-state HTTP '+str(state.status_code))
          state_data=state.json()
          table_ids=[v.get('id') for v in state_data.get('tables',[])]
          if 'home_00' not in table_ids or 'home_01' not in table_ids:
            raise SystemExit('Builder page-state did not discover home_00/home_01')
          if any(len(t.get('version',''))!=64 for t in state_data['tables']):
            raise SystemExit('Builder page-state versions are invalid')
          batch=session.post(root+'/wp-json/esc-builder/v1/table-batch',json={
            'ticket':ticket,'page_id':page_id,'table_ids':['home_00','home_01']
          },timeout=45)
          if batch.status_code!=200:
            raise SystemExit('Builder table-batch HTTP '+str(batch.status_code))
          sources=batch.json().get('sources',{})
          for table_id in ['home_00','home_01']:
            table_data=sources.get(table_id,{}).get('table',{})
            if table_data.get('id')!=table_id or not isinstance(table_data.get('items'),list):
              raise SystemExit('Builder batch source invalid: '+table_id)
          # Builder Giai đoạn 2: inspect editable column names/types only.
          # Never print actual website content, customer data or bearer tickets.
          for tid in ['home_00','home_01']:
            raw=sources.get(tid,{}).get('table',{})
            rows=raw.get('items') or []
            fields=[{'name':k,'type':type(v).__name__,'chars':len(str(v))}
                    for k,v in (rows[0] if rows else {}).items()]
            print('BUILDER_EDIT_SOURCE_SCHEMA='+str({
              'id':tid,'row_count':len(rows),'fields':fields,
              'meta_keys':list((raw.get('meta') or {}).keys())
            }))
          layout=session.post(root+'/wp-json/esc-builder/v1/page-layout',json={
            'ticket':ticket,'page_id':page_id
          },timeout=35)
          if layout.status_code!=200:
            raise SystemExit('Builder page-layout HTTP '+str(layout.status_code))
          lp=layout.json().get('page',{})
          if lp.get('id')!=page_id or not isinstance(lp.get('content',{}).get('rendered'),str):
            raise SystemExit('Builder current Page layout source invalid')
          print('ESC Builder live Page HTML source PASS: authenticated editor-only layout fetched.')
          for ids in [['home_04','home_05','home_06','home_07'],['home_08']]:
            scan=session.post(root+'/wp-json/esc-builder/v1/table-batch',json={
              'ticket':ticket,'page_id':page_id,'table_ids':ids
            },timeout=45)
            if scan.status_code!=200: raise SystemExit('Builder dependency scan HTTP '+str(scan.status_code))
            for tid in ids:
              tab=scan.json().get('sources',{}).get(tid,{}).get('table',{})
              first=(tab.get('items') or [{}])[0]
              print('BUILDER_TABLE_DEPENDENCY='+str({
                'id':tid,'api':(tab.get('meta') or {}).get('api'),
                'rows':len(tab.get('items') or []),
                'first_fields':list(first.keys())[:12],
                'sample_key':str(first.get('key',first.get('_id',first.get('api-key',''))))[:35]
              }))
          print('ESC Builder live-first page-state PASS: '+str(len(table_ids))+
                ' ESC Table sources discovered; bounded home_00/home_01 batch PASS.')
          table=session.post(root+'/wp-json/esc-builder/v1/table-source',json={
            'ticket':ticket,'page_id':page_id,'table_id':'home_00'
          },timeout=35)
          if table.status_code!=200:
            # Never print ticket, cookie or response body in logs.
            try: error_code=str(table.json().get('code','unknown'))[:65]
            except Exception: error_code='non-json-response'
            raise SystemExit('Builder single-table contract HTTP '+str(table.status_code)+' code='+error_code)
          t=table.json().get('table')
          if not isinstance(t,dict) or t.get('id')!='home_00' or not isinstance(t.get('items'),list):
            raise SystemExit('ESC Table adapter returned unexpected schema (expected id and items)')
          unauthorized=session.post(root+'/wp-json/esc-builder/v1/table-source',json={
            'ticket':'invalid','page_id':page_id,'table_id':'home_00'
          },timeout=30)
          if unauthorized.status_code!=403:
            raise SystemExit('Invalid Builder ticket was not rejected (expected HTTP 403)')
          # Full-stack check: one SSR request refreshes ONE section after
          # ticket verification. No WordPress edits/build/cache writes.
          live=session.get(src + '&refresh_table=home_00',timeout=110)
          if live.status_code!=200:
            raise SystemExit('Builder refreshed iframe HTTP '+str(live.status_code))
          refresh=live.headers.get('X-ESC-Builder-Section-Refresh','')
          if refresh!='updated':
            raise SystemExit('Builder refresh failed or served stale, header='+str(refresh)[:45])
          parsed=BeautifulSoup(live.text,'html.parser')
          updated=parsed.select_one('[data-tablepress-preview="home_00"]')
          if not updated:
            raise SystemExit('Builder refresh rendered without home_00 wrapper')
          if not parsed.select_one('[data-esc-builder-refresh-status]'):
            raise SystemExit('Builder refresh lacks visible update confirmation')
          image_sources=[img.get('src','') for img in updated.select('img[src]')]
          direct=sum('/wp-content/uploads/' in url and '/api/images/' not in url for url in image_sources)
          proxy=sum('/api/images/' in url for url in image_sources)
          print(f'ESC Builder LIVE SSR PASS: home_00 updated; images={len(image_sources)} direct_uploads={direct} legacy_proxy={proxy} (paths omitted).')
          print('ESC Builder WordPress CONTRACT PASS: changes metadata 200; one home_00 source 200; invalid ticket 403.')
          PY
