name: ESC Builder Page Editor Chrome QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/esc-builder-page-text-browser.txt'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test real Page HTML preview draft and Cancel without a write
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const root=new URL(process.env.WP_ADMIN_URL).origin;
          const browser=await puppeteer.launch({
            headless:true,executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page=await browser.newPage();
            await page.setViewport({width:1360,height:900,deviceScaleFactor:1});
            const writes=[];
            const errors=[];
            let pageRows=[];
            page.on('response',async response=>{
              try{
                if(new URL(response.url()).pathname.endsWith('/esc-builder/v1/editable-page-text') &&
                   response.status()===200)
                  pageRows=(await response.json()).rows||[];
              }catch{}
            });
            page.on('pageerror',e=>errors.push(String(e.message).slice(0,160)));
            page.on('request',r=>{
              try{if(new URL(r.url()).pathname.endsWith('/esc-builder/v1/save-page-text'))
                writes.push(r.method());}catch{}
            });
            async function visit(url){
              let last;
              for(let attempt=0;attempt<2;attempt++){
                try{
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:attempt?65000:45000});
                  if(response?.status()===200)return;
                  last=Error('HTTP '+response?.status());
                }catch(e){last=e;}
                await new Promise(r=>setTimeout(r,1200));
              }
              throw last;
            }
            await visit(root+'/wp-login.php');
            await page.waitForSelector('#user_login',{timeout:20000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('/wp-login.php'))throw Error('WP login denied');
            const pageId=51979; // confirmed to contain literal Page Editor HTML
            await visit(root+'/wp-admin/admin.php?page=esc-visual-builder&esc_vb_page='+pageId);
            await page.waitForSelector('#esc-vb-frame',{timeout:20000});
            const iframeHandle=await page.$('#esc-vb-frame');
            const frame=await iframeHandle.contentFrame();
            if(!frame)throw Error('Builder iframe is inaccessible');
            await frame.waitForSelector('[data-esc-builder-html-part]',{timeout:90000});
            const frameUrl=frame.url();
            const partAudit=await frame.evaluate(()=>
              [...document.querySelectorAll('[data-esc-builder-html-part]')].map(el=>({
                part:el.getAttribute('data-esc-builder-html-part'),
                tag:el.tagName,descendants:el.querySelectorAll('*').length,
                textNodes:(()=>{let n=0;const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                  while(walker.nextNode()){if(walker.currentNode.nodeValue.trim())n++;}
                  return n;})()
              })));
            console.log('BUILDER_PAGE_PART_DOM='+JSON.stringify(partAudit.slice(0,30)));
            const nodes=await frame.evaluate(() =>
              [...document.querySelectorAll('[data-esc-builder-html-part] *')].map((el,index)=>({
                index,text:(el.textContent||'').trim(),
                childElements:el.children.length,tag:el.tagName
              })));
            let found=null;
            let attempts=0;
            for(const meta of nodes.slice(0,130)){
              if(meta.childElements || meta.text.length<2 || meta.text.length>260 ||
                 ['SCRIPT','STYLE','SVG','OPTION','NOSCRIPT','TEMPLATE'].includes(meta.tag))continue;
              const clicked=await frame.evaluate(index=>{
                const el=document.querySelectorAll('[data-esc-builder-html-part] *')[index];
                if(!el)return false;
                el.scrollIntoView({block:'center'});
                el.click();
                return true;
              },meta.index).catch(()=>false);
              if(!clicked)continue;
              attempts++;
              await page.waitForFunction(() => {
                const caption=document.querySelector('#esc-vb-edit-caption')?.textContent||'';
                const panel=document.querySelector('#esc-vb-text-editor');
                return panel?.style.display==='block' &&
                  (document.querySelector('#esc-vb-edit-row')?.options.length>0 ||
                   (caption.length>0 && !caption.includes('đang đọc')));
              },{timeout:25000}).catch(()=>{});
              const state=await page.evaluate(()=>{
                const inspector=document.querySelector('#esc-vb-inspector')?.textContent||'';
                const editor=document.querySelector('#esc-vb-text-editor');
                const input=document.querySelector('#esc-vb-edit-title');
                const select=document.querySelector('#esc-vb-edit-row');
                return {
                  isEditor:inspector.includes('"source": "WordPress Editor"'),
                  visible:editor?.style.display==='block',
                  inputReady:!!input&&!input.disabled,
                  options:select?.options?.length||0,
                  value:input?.value||'',
                  feedback:document.querySelector('#esc-vb-edit-feedback')?.textContent||'',
                  caption:document.querySelector('#esc-vb-edit-caption')?.textContent||''
                };
              });
              if(attempts<=12)console.log('BUILDER_PAGE_SELECTION_DIAGNOSTIC='+JSON.stringify({
                attempt:attempts,tag:meta.tag,sourceEditor:state.isEditor,
                panelVisible:state.visible,inputReady:state.inputReady,
                options:state.options,valueMatches:state.value===meta.text,
                caption:state.caption.slice(0,120),feedback:state.feedback.slice(0,150)
              }));
              if(state.isEditor && state.visible && state.inputReady &&
                 state.options>0 && state.value===meta.text){
                found={tag:meta.tag,wordCount:meta.text.split(/\\s+/).length};
                break;
              }
            }
            if(!found) throw Error('No matching WordPress Editor text could be selected; tested '+attempts+' candidates.');
            const original=await page.$eval('#esc-vb-edit-title',el=>el.value);
            const marker=' __ESC_PAGE_QA_DRAFT_ONLY__';
            await page.$eval('#esc-vb-edit-title',(el,v)=>{
              el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));
            },original+marker);
            await frame.waitForFunction(marker=>document.querySelector('[data-esc-builder-html-part]')?.textContent?.includes(marker) ||
              [...document.querySelectorAll('[data-esc-builder-html-part]')].some(el=>el.textContent.includes(marker)),
              {timeout:12000},marker);
            if(!await page.$eval('#esc-vb-edit-save',el=>!el.disabled))
              throw Error('Page Editor draft did not enable Save');
            await page.click('#esc-vb-edit-cancel');
            await frame.waitForFunction(marker=>![...document.querySelectorAll('[data-esc-builder-html-part]')].some(el=>el.textContent.includes(marker)),{timeout:12000},marker);
            if(await page.$eval('#esc-vb-edit-title',el=>el.value)!==original)
              throw Error('Cancel did not restore the original');
            if(frame.url()!==frameUrl)throw Error('Page Editor preview reloaded iframe');
            const partial=await frame.evaluate((rows)=>{
              const scopes=[...document.querySelectorAll('[data-esc-builder-html-part]')];
              for(const scope of scopes){
                const part=Number(scope.getAttribute('data-esc-builder-html-part'));
                const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);
                const nodes=[];
                let node;
                while((node=walker.nextNode())){
                  if(!node.parentElement ||
                     node.parentElement.closest('script,style,svg,textarea,template,noscript,pre,code'))continue;
                  const full=node.nodeValue||'';
                  if(!full.trim() || full.length>4000 || /[<>]/.test(full.trim()) ||
                     /\\[[a-z_][^\\]]*\\]/i.test(full))continue;
                  nodes.push(node);
                }
                for(const row of rows.filter(r=>r.part===part)){
                  const matched=nodes[row.node_index];
                  if(!matched || matched.nodeValue!==row.full_text ||
                     matched.nodeValue.trim().length<10)continue;
                  const full=matched.nodeValue;
                  const first=full.search(/\\S/),start=first+2,end=Math.min(first+9,full.length);
                  if(start>=end || !full.slice(start,end).trim())continue;
                  const range=document.createRange();
                  range.setStart(matched,start);range.setEnd(matched,end);
                  const selection=window.getSelection();
                  selection.removeAllRanges();selection.addRange(range);
                  matched.parentElement.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));
                  return {selected:full.slice(start,end),full,start,end};
                }
              }
              return null;
            },pageRows);
            if(!partial)throw Error('No single-node selectable substring on this Page');
            await new Promise(r=>setTimeout(r,1250));
            const partialState=await page.evaluate(()=>{
              const field=document.querySelector('#esc-vb-edit-title');
              const select=document.querySelector('#esc-vb-edit-row');
              return {
                textLength:field?.value?.length??null,
                fieldSelected:select?.value??null,
                matchesAny:!!select?.value,
                feedback:(document.querySelector('#esc-vb-edit-feedback')?.textContent||'').slice(0,150),
                inspector:(document.querySelector('#esc-vb-inspector')?.textContent||'').slice(0,650),
              };
            });
            const inspector=await page.$eval('#esc-vb-inspector',el=>el.textContent);
            let hint={};try{hint=JSON.parse(inspector||'{}').selection||{};}catch{}
            const inPart=pageRows.filter(row=>row.part===hint.part);
            console.log('ESC_PAGE_PARTIAL_DIAGNOSTIC='+JSON.stringify({
              selectedLen:partial.selected.length,sourceLen:partial.full.length,
              match:partialState.textLength===partial.selected.length,
              fieldSelected:partialState.fieldSelected,
              hintPart:hint.part,nodeIndex:hint.nodeIndex,
              sourceRows:inPart.map(row=>({
                nodeIndex:row.node_index,length:row.full_text?.length,
                same:row.full_text===hint.original,
                normalized:String(row.full_text||'').replace(/\\s+/g,' ').trim()===
                  String(hint.original||'').replace(/\\s+/g,' ').trim()
              })),
              feedback:partialState.feedback,
              inspectorHasSelection:partialState.inspector.includes('"selection"'),
            }));
            await page.waitForFunction(value=>document.querySelector('#esc-vb-edit-title')?.value===value,
              {timeout:6000},partial.selected);
            const chosen=await page.$eval('#esc-vb-edit-title',el=>el.value);
            if(chosen===partial.full)throw Error('Editor selected entire text instead of the substring');
            const partialMarker='__VB_PARTIAL_DRAFT_ONLY__';
            await page.$eval('#esc-vb-edit-title',(el,value)=>{
              el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));
            },chosen+partialMarker);
            await frame.waitForFunction(value=>[...document.querySelectorAll('[data-esc-builder-html-part]')]
              .some(el=>el.textContent.includes(value)),{timeout:12000},partialMarker);
            if(!(await page.$eval('#esc-vb-edit-save',el=>!el.disabled)))
              throw Error('Partial text preview did not enable Save');
            await page.click('#esc-vb-edit-cancel');
            await frame.waitForFunction(value=>[...document.querySelectorAll('[data-esc-builder-html-part]')]
              .every(el=>!el.textContent.includes(value)),{timeout:12000},partialMarker);
            if(await page.$eval('#esc-vb-edit-title',el=>el.value)!==partial.selected)
              throw Error('Cancel failed to restore partial selected text');
            if(frame.url()!==frameUrl)throw Error('Partial selection reloaded iframe');
            if(writes.length)throw Error('Chrome QA unexpectedly wrote WordPress Page content');
            console.log('ESC_BUILDER_PAGE_PARTIAL_PASS='+JSON.stringify({
              selectionLength:partial.selected.length,wholeLength:partial.full.length,
              preview:true,cancel:true,iframeReloaded:false,writes:0
            }));
            console.log('ESC_BUILDER_PAGE_EDITOR_BROWSER_PASS='+JSON.stringify({
              pageId,selectedTag:found.tag,
              candidateWordCount:found.wordCount,
              previewImmediate:true,cancelRestored:true,iframeReloaded:false,
              customerDataWrites:0,errors
            }));
          }finally{await browser.close();}
          JS
