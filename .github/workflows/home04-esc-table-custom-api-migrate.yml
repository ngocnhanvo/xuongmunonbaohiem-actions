name: Set Home04 ESC Table Custom API Source (One Time)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home04-esc-table-custom-api-migrate.yml'
permissions:
  contents: read
concurrency:
  group: blue-sea-home04-esc-db-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout fixed migration code
        uses: actions/checkout@v4
      - name: Confirm WordPress production environment and save before-state
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from urllib.parse import urlsplit
          values=[]
          for line in os.environ.get('ENV_FILE','').splitlines():
              s=line.strip().removeprefix('export ').strip()
              if s.startswith('WC_URL='):
                  values.append(s.partition('=')[2].strip().strip('"').strip("'"))
          if len(values)!=1:raise SystemExit('Missing or ambiguous WC_URL')
          u=urlsplit(values[0])
          if u.scheme!='https' or u.hostname!='admin.xuongmunonbaohiem.com' or u.path not in ('','/') or u.query or u.fragment or u.username or u.password:
              raise SystemExit('Unexpected WordPress host; migration aborted')
          base='https://admin.xuongmunonbaohiem.com'
          for table in ['home_04','home_05']:
              req=urllib.request.Request(base+'/wp-json/tablepress/v1/table/'+table,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as response:
                  result=json.load(response)
              if not result.get('success') or result.get('id')!=table:raise SystemExit('Cannot read ESC Table '+table)
              with open(os.path.join(os.environ['RUNNER_TEMP'],table+'-before.json'),'w') as output:
                  json.dump(result,output,ensure_ascii=False)
              print(table,'source:',result.get('meta',{}).get('api'),'rows:',len(result.get('items',[])))
          table=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'home_04-before.json')))
          if table.get('meta',{}).get('api') not in ('Product', '/wp-json/wp/v2/product?product_cat_slug=non-bao-hiem-nua-dau&product_lang=vi&status=publish&per_page=8&orderby=date&order=desc'):
              raise SystemExit('Table source edited concurrently; refusing migration')
          PY
      - name: Create one-time signed PHP request, lint, and prepare FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          token="$(openssl rand -hex 32)"
          nonce="$(openssl rand -hex 10)"
          echo "::add-mask::$token"
          echo "HOME04_TOKEN=$token" >> "$GITHUB_ENV"
          echo "HOME04_SCRIPT=esc-home04-once-${GITHUB_RUN_ID}-$nonce.php" >> "$GITHUB_ENV"
          HOME04_TOKEN="$token" python3 - <<'PY'
          import hashlib,os,pathlib
          source=pathlib.Path('scripts/home04-esc-custom-api-once.php').read_text(encoding='utf-8')
          marker='__AUTH_TOKEN_SHA256__'
          assert source.count(marker)==1
          source=source.replace(marker,hashlib.sha256(os.environ['HOME04_TOKEN'].encode()).hexdigest())
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'esc-home04-once.php'
          dest.write_text(source,encoding='utf-8')
          PY
          php -l "$RUNNER_TEMP/esc-home04-once.php"
          if ! command -v lftp >/dev/null 2>&1; then sudo apt-get install -qq -y lftp; fi
      - name: Upload temporary signed migration to WordPress root
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HOME04_SCRIPT"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 25
          set ssl:verify-certificate no
          cd /domains/admin.xuongmunonbaohiem.com/public_html
          put "$RUNNER_TEMP/esc-home04-once.php" -o "$HOME04_SCRIPT"
          get "$HOME04_SCRIPT" -o "$RUNNER_TEMP/esc-home04-uploaded.php"
          bye
          LFTP
          cmp "$RUNNER_TEMP/esc-home04-once.php" "$RUNNER_TEMP/esc-home04-uploaded.php"
      - name: Update ESC Table with authenticated request
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 15 --max-time 80 \
            -H "X-Esc-Home04-Token: $HOME04_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "https://admin.xuongmunonbaohiem.com/$HOME04_SCRIPT" \
            -o "$RUNNER_TEMP/home04-migrate-result.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'home04-migrate-result.json')))
          if d.get('ok') is not True or d.get('table_id')!='home_04' or d.get('items')!=1:
              raise SystemExit('WordPress migration returned failure')
          print('ESC home_04 source saved:',d['api'],'changed:',d.get('changed'))
          PY
      - name: Verify WordPress stored API, one auto row, and home05 unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://admin.xuongmunonbaohiem.com/wp-json/tablepress/v1/table/'
          def read(name):
              req=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as res:return json.load(res)
          current=read('home_04')
          old=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'home_04-before.json')))
          want='/wp-json/wp/v2/product?product_cat_slug=non-bao-hiem-nua-dau&product_lang=vi&status=publish&per_page=8&orderby=date&order=desc'
          assert current.get('meta',{}).get('api')==want,'WordPress API not persisted'
          assert current['id']=='home_04' and current['title']==old['title']
          assert current['settings']==old['settings'],'Layout settings modified'
          assert len(current['items'])==1,'Expected single template row'
          assert current['items'][0]=={
              'api-key':'auto','note':'','api-name':'title.rendered',
              'api-slug':'slug','api-img':'featured_media_url',
          },'Incorrect saved API mapping'
          assert [x['key'] for x in current['fields']]==['api-key','note','api-name','api-slug','api-img']
          assert read('home_05')==json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'home_05-before.json'))),'home_05 changed'
          print('PASS saved WordPress ESC Table home_04: API tùy chỉnh + auto row, home05 unchanged')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as s:
              s.write('PASS: WordPress ESC Table home_04 stored Custom API, 1 auto row and preserved title/layout. Home_05 unchanged.\n')
          PY
      - name: Remove temporary PHP script from WordPress root
        if: always()
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HOME04_SCRIPT:-}" ]; then exit 0; fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 25
          set ssl:verify-certificate no
          cd /domains/admin.xuongmunonbaohiem.com/public_html
          rm -f "$HOME04_SCRIPT"
          bye
          LFTP
          echo 'Temporary WordPress migration entry point removed.' >> "$GITHUB_STEP_SUMMARY"
