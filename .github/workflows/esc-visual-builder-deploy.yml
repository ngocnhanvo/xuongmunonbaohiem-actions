name: Deploy and Verify ESC Visual Builder PHP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/esc-visual-builder-deploy.txt'

permissions:
  contents: read
concurrency:
  group: esc-visual-builder-wordpress-deploy
  cancel-in-progress: false

jobs:
  deploy-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate required connection secrets
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$WP_ADMIN_URL"

      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Confirm source and check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git -C source rev-parse HEAD
          php -l source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          php -l source/wp-content/plugins/esc-visual-builder/includes/change-index.php
          php -l source/wp-content/plugins/esc-visual-builder/includes/text-editor.php
          php -l source/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php
          php -l source/wp-content/plugins/github-trigger/vcs-hook.php
          grep -Fq "ESC Visual Builder" source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq "current_user_can('edit_post'" source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php

      - name: Resolve WordPress FTP path and host
        id: wp
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from urllib.parse import urlparse
          import os
          url = os.environ["WP_ADMIN_URL"]
          parsed = urlparse(url if "://" in url else "https://" + url)
          if not parsed.hostname:
              raise SystemExit("Invalid WP_ADMIN_URL")
          print("host=" + parsed.hostname)
          print("plugin_dir=/domains/" + parsed.hostname + "/public_html/wp-content/plugins/esc-visual-builder")
          PY

      - name: Upload only ESC Visual Builder and byte-verify over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          REMOTE_DIR: ${{ steps.wp.outputs.plugin_dir }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lftp
          url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          scheme = os.getenv("FTP_PROTOCOL") or "ftp"
          assert scheme in ("ftp", "ftps", "sftp"), "Unsupported FTP protocol"
          print(scheme + "://" + quote(os.environ["FTP_USERNAME"],safe="") +
                ":" + quote(os.environ["FTP_PASSWORD"],safe="") +
                "@" + os.environ["FTP_SERVER"])
          PY
          )"
          lftp "$url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate no
          mkdir -pf "$REMOTE_DIR"
          cd "${REMOTE_DIR%/esc-visual-builder}/github-trigger"
          put source/wp-content/plugins/github-trigger/vcs-hook.php -o vcs-hook.php
          get vcs-hook.php -o /tmp/esc-vb-github-hook-remote.php
          cd "$REMOTE_DIR"
          mkdir -pf includes
          put source/wp-content/plugins/esc-visual-builder/includes/change-index.php -o includes/change-index.php
          get includes/change-index.php -o /tmp/esc-vb-revision-remote.php
          put source/wp-content/plugins/esc-visual-builder/includes/text-editor.php -o includes/text-editor.php
          get includes/text-editor.php -o /tmp/esc-vb-text-editor-remote.php
          put source/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php -o includes/text-editor-ui.php
          get includes/text-editor-ui.php -o /tmp/esc-vb-text-ui-remote.php
          put source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php -o esc-visual-builder.php
          get esc-visual-builder.php -o /tmp/esc-visual-builder-remote.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php /tmp/esc-visual-builder-remote.php
          cmp source/wp-content/plugins/github-trigger/vcs-hook.php /tmp/esc-vb-github-hook-remote.php
          php -l /tmp/esc-vb-github-hook-remote.php
          cmp source/wp-content/plugins/esc-visual-builder/includes/change-index.php /tmp/esc-vb-revision-remote.php
          php -l /tmp/esc-vb-revision-remote.php
          cmp source/wp-content/plugins/esc-visual-builder/includes/text-editor.php /tmp/esc-vb-text-editor-remote.php
          cmp source/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php /tmp/esc-vb-text-ui-remote.php
          php -l /tmp/esc-vb-text-editor-remote.php
          php -l /tmp/esc-vb-text-ui-remote.php
          php -l /tmp/esc-visual-builder-remote.php
          echo "ESC Visual Builder plugin byte-verified on FTP"

      - name: Try WordPress plugin activation
        env:
          WP_HOST: ${{ steps.wp.outputs.host }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WP_ADMIN_USERNAME:-}" ] || [ -z "${WP_ADMIN_PASSWORD:-}" ]; then
            echo "::warning::WP credentials unavailable: plugin uploaded but manual activation required."
            exit 0
          fi
          python3 -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import os, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          root = 'https://' + os.environ['WP_HOST']
          session = requests.Session()
          session.headers.update({'User-Agent':'ESC-Visual-Builder-Deployment/1.0'})
          session.get(root+'/wp-login.php',timeout=30)
          session.post(root+'/wp-login.php', data={
              'log': os.environ['WP_ADMIN_USERNAME'], 'pwd':os.environ['WP_ADMIN_PASSWORD'],
              'wp-submit':'Log In', 'redirect_to':root+'/wp-admin/plugins.php',
              'testcookie':'1'
          }, timeout=40,allow_redirects=True)
          plugins=session.get(root+'/wp-admin/plugins.php?plugin_status=all',timeout=30)
          if 'wp-login.php' in plugins.url:
              raise SystemExit('WordPress admin login could not be verified; plugin remains uploaded but not activated.')
          row=BeautifulSoup(plugins.text,'html.parser').select_one('tr[data-slug="esc-visual-builder"]')
          if row is None:
              raise SystemExit('Plugin row not found in WordPress Plugins after FTP upload.')
          if 'active' in row.get('class',[]):
              print('Plugin already active: no change required.')
          else:
              activate=row.select_one('a[href*="action=activate"]')
              if not activate:
                  raise SystemExit('Could not identify activation nonce/link. Manual activation required.')
              session.get(urljoin(plugins.url,activate.get('href')),timeout=30)
              verify=session.get(root+'/wp-admin/plugins.php?plugin_status=active',timeout=30)
              active_row=BeautifulSoup(verify.text,'html.parser').select_one('tr[data-slug="esc-visual-builder"]')
              if not active_row or 'active' not in active_row.get('class',[]):
                  raise SystemExit('Plugin activation could not be verified.')
              print('ESC Visual Builder activated and verified.')
          PY

      - name: Verify protected WordPress API
        env:
          WP_HOST: ${{ steps.wp.outputs.host }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/esc-vb-invalid-ticket.json -w '%{http_code}' \
             -H 'Content-Type: application/json' -d '{"ticket":"invalid","page_id":1}' \
             --max-time 30 "https://$WP_HOST/wp-json/esc-builder/v1/verify")"
          echo "Invalid preview ticket response: HTTP $code"
          test "$code" = 403
          grep -q 'invalid_ticket' /tmp/esc-vb-invalid-ticket.json
          echo "Authenticated-only preview endpoint rejects invalid credentials."
          changed_code="$(curl -sS -o /tmp/esc-vb-changes-deny.json -w '%{http_code}'              -H 'Content-Type: application/json' -d '{"ticket":"invalid","page_id":1,"since":0}'              --max-time 30 "https://$WP_HOST/wp-json/esc-builder/v1/changes")"
          test "$changed_code" = 403
          echo "Revision API also rejects unauthorized requests."
