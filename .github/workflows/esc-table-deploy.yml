name: Deploy ESC Table Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/esc-table-deploy.txt'

permissions:
  contents: read

concurrency:
  group: xuongmunonbaohiem-actions-esc-table-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$WP_ADMIN_URL"

      - name: Checkout WordPress source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        run: echo "Deploying xuongmunonbaohiem-php@master $(git rev-parse HEAD)"

      - name: Validate ESC Table before deploy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f wp-content/plugins/esc-table/esc-table.php
          test ! -e wp-content/plugins/tablepress/tablepress.php
          grep -Fq 'Plugin Name: ESC Table' wp-content/plugins/esc-table/esc-table.php
          grep -Fq 'Update URI: https://esc.vn/plugins/esc-table' wp-content/plugins/esc-table/esc-table.php
          grep -Fq "register_rest_route( 'esc-table/v1', '/status'" wp-content/plugins/esc-table/esc-table.php
          test -f wp-content/plugins/esc-table/classes/class-esc-table-upstream-compat.php
          test ! -d wp-content/plugins/esc-table/libraries/freemius
          if grep -Fq "libraries/freemius/start.php" wp-content/plugins/esc-table/esc-table.php; then
            echo '::error::ESC Table still initializes the Freemius SDK.'
            exit 1
          fi
          php -l wp-content/plugins/esc-table/esc-table.php
          php -l wp-content/plugins/esc-table/controllers/controller-admin.php
          php -l wp-content/mu-plugins/esc-table-migration.php
          php -l wp-content/mu-plugins/disable-plugins-for-api.php
          php -l wp-content/mu-plugins/esc-admin-menu-bridge.php
          php wp-content/mu-plugins/tests/esc-table-migration.php
          php wp-content/mu-plugins/tests/esc-table-upstream-compat.php
          php wp-content/mu-plugins/tests/admin-performance-custom-content-ajax.php

      - name: Resolve WordPress FTP path
        id: wp_path
        shell: bash
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ['WP_ADMIN_URL'].strip()
          parsed = urlparse(raw if '://' in raw else 'https://' + raw)
          if not parsed.hostname:
              raise SystemExit('Unable to resolve hostname from WP_ADMIN_URL')
          print(parsed.hostname)
          PY
          )"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "remote_wp_root=/domains/$host/public_html" >> "$GITHUB_OUTPUT"
          echo "remote_wp_content=/domains/$host/public_html/wp-content" >> "$GITHUB_OUTPUT"
          echo 'Resolved WordPress production path.'

      - name: Install FTP client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

      - name: Build atomic ESC Table package
        id: package
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/esc-table-runtime.zip /tmp/esc-table-deploy.php
          zip -qr /tmp/esc-table-runtime.zip \
            wp-content/plugins/esc-table \
            wp-content/mu-plugins/esc-table-migration.php \
            wp-content/mu-plugins/disable-plugins-for-api.php \
            wp-content/mu-plugins/esc-admin-menu-bridge.php

          deploy_token="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "token=$deploy_token" >> "$GITHUB_OUTPUT"

          cat > /tmp/esc-table-deploy.php <<'PHP'
          <?php
          declare(strict_types=1);

          header('Content-Type: application/json; charset=utf-8');

          $expectedToken = '__ESC_TABLE_DEPLOY_TOKEN__';
          $providedToken = isset($_GET['token']) && is_string($_GET['token']) ? $_GET['token'] : '';
          if (!hash_equals($expectedToken, $providedToken)) {
              http_response_code(403);
              echo json_encode(['ok' => false, 'error' => 'forbidden']);
              exit;
          }

          function escTableDeleteDir(string $path): void {
              if (!is_dir($path)) {
                  return;
              }
              $iterator = new RecursiveIteratorIterator(
                  new RecursiveDirectoryIterator($path, FilesystemIterator::SKIP_DOTS),
                  RecursiveIteratorIterator::CHILD_FIRST
              );
              foreach ($iterator as $item) {
                  if ($item->isDir()) {
                      rmdir($item->getPathname());
                  } else {
                      unlink($item->getPathname());
                  }
              }
              rmdir($path);
          }

          $root = __DIR__;
          $zipFile = $root . '/esc-table-runtime.zip';
          $staging = $root . '/.esc-table-staging-' . bin2hex(random_bytes(6));
          $pluginDir = $root . '/wp-content/plugins/esc-table';
          $legacyDir = $root . '/wp-content/plugins/tablepress';
          $muDir = $root . '/wp-content/mu-plugins';

          try {
              if (!is_file($zipFile)) {
                  throw new RuntimeException('deployment package missing');
              }

              if (!mkdir($staging, 0755, true) && !is_dir($staging)) {
                  throw new RuntimeException('unable to create staging directory');
              }

              $zip = new ZipArchive();
              if ($zip->open($zipFile) !== true) {
                  throw new RuntimeException('unable to open deployment package');
              }
              if (!$zip->extractTo($staging)) {
                  $zip->close();
                  throw new RuntimeException('unable to extract deployment package');
              }
              $zip->close();

              $stagedPlugin = $staging . '/wp-content/plugins/esc-table';
              $stagedMain = $stagedPlugin . '/esc-table.php';
              if (!is_file($stagedMain)) {
                  throw new RuntimeException('staged ESC Table main file missing');
              }

              if (is_dir($pluginDir)) {
                  escTableDeleteDir($pluginDir);
              }
              if (!rename($stagedPlugin, $pluginDir)) {
                  throw new RuntimeException('unable to activate staged ESC Table directory');
              }

              foreach ([
                  'esc-table-migration.php',
                  'disable-plugins-for-api.php',
                  'esc-admin-menu-bridge.php',
              ] as $muFile) {
                  $source = $staging . '/wp-content/mu-plugins/' . $muFile;
                  $target = $muDir . '/' . $muFile;
                  if (!is_file($source) || !copy($source, $target)) {
                      throw new RuntimeException('unable to deploy MU file: ' . $muFile);
                  }
              }

              if (is_dir($legacyDir)) {
                  escTableDeleteDir($legacyDir);
              }

              escTableDeleteDir($staging);
              @unlink($zipFile);

              $response = [
                  'ok' => true,
                  'plugin' => 'ESC Table',
                  'main_sha256' => hash_file('sha256', $pluginDir . '/esc-table.php'),
                  'legacy_tablepress_present' => is_dir($legacyDir),
              ];
              echo json_encode($response, JSON_UNESCAPED_SLASHES);
              @unlink(__FILE__);
          } catch (Throwable $e) {
              if (is_dir($staging)) {
                  escTableDeleteDir($staging);
              }
              http_response_code(500);
              echo json_encode(['ok' => false, 'error' => $e->getMessage()]);
          }
          PHP
          DEPLOY_TOKEN="$deploy_token" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('/tmp/esc-table-deploy.php')
          text = path.read_text(encoding='utf-8')
          path.write_text(
              text.replace('__ESC_TABLE_DEPLOY_TOKEN__', os.environ['DEPLOY_TOKEN']),
              encoding='utf-8',
          )
          PY
          php -l /tmp/esc-table-deploy.php
          echo "Package bytes: $(stat -c%s /tmp/esc-table-runtime.zip)"

      - name: Upload atomic ESC Table package through FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          REMOTE_WP_ROOT: ${{ steps.wp_path.outputs.remote_wp_root }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          export protocol FTP_SERVER FTP_USERNAME FTP_PASSWORD
          ftp_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          protocol = os.environ.get('protocol', 'ftp')
          server = os.environ['FTP_SERVER']
          username = quote(os.environ['FTP_USERNAME'], safe='')
          password = quote(os.environ['FTP_PASSWORD'], safe='')
          print(f'{protocol}://{username}:{password}@{server}')
          PY
          )"

          lftp "$ftp_url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 3
          set ssl:verify-certificate no
          put "/tmp/esc-table-runtime.zip" -o "$REMOTE_WP_ROOT/esc-table-runtime.zip"
          put "/tmp/esc-table-deploy.php" -o "$REMOTE_WP_ROOT/esc-table-deploy.php"
          bye
          LFTP
          echo 'ESC Table package and one-time extractor uploaded.'

      - name: Atomically install ESC Table package
        shell: bash
        env:
          WP_HOST: ${{ steps.wp_path.outputs.host }}
          DEPLOY_TOKEN: ${{ steps.package.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --connect-timeout 10 --max-time 120 "https://$WP_HOST/esc-table-deploy.php?token=$DEPLOY_TOKEN")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq '"ok":true'
          printf '%s' "$response" | grep -Fq '"legacy_tablepress_present":false'
          echo 'ESC Table atomic install completed.'

      - name: Smoke test ESC Table production
        shell: bash
        env:
          WP_HOST: ${{ steps.wp_path.outputs.host }}
        run: |
          set -euo pipefail
          status_url="https://$WP_HOST/wp-json/esc-table/v1/status"
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/esc-table-status.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$status_url" || true)"
            if [ "$code" = '200' ] \
              && grep -Fq '"plugin":"ESC Table"' /tmp/esc-table-status.json \
              && grep -Fq '"version":"1.0.0"' /tmp/esc-table-status.json \
              && grep -Fq '"upstream_baseline":"TablePress 3.3.4"' /tmp/esc-table-status.json; then
              cat /tmp/esc-table-status.json
              echo
              echo 'ESC Table production smoke test passed.'
              exit 0
            fi
            echo "Attempt ${attempt}/12: HTTP ${code:-curl-error}; waiting for plugin migration..."
            sleep 5
          done
          cat /tmp/esc-table-status.json 2>/dev/null || true
          echo '::error::ESC Table status endpoint did not become healthy.'
          exit 1
