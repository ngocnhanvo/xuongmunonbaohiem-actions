name: Deploy Blue Sea Builder Safe Navigation PHP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [requests/esc-builder-header-nav-php-deploy.txt]
permissions:
  contents: read
concurrency:
  group: blue-sea-builder-safe-header-nav-php
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve WC_URL from ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          values = []
          for line in os.environ.get("ENV_FILE", "").splitlines():
              line = line.strip()
              if line.startswith("export "): line = line[7:].strip()
              if line.startswith("WC_URL="):
                  v = line.split("=", 1)[1].strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'): v = v[1:-1]
                  values.append(v)
          if len(values) != 1: raise SystemExit("ENV_FILE must contain exactly one WC_URL")
          url = urlsplit(values[0])
          host = (url.hostname or "").lower()
          if (url.scheme != "https" or not re.fullmatch(r"[a-z0-9.-]+", host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None, 443) or url.path not in ("", "/")
                  or url.query or url.fragment):
              raise SystemExit("Invalid backend WC_URL in ENV_FILE")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("WC_URL=https://" + host + "\n")
          print("Backend domain:", host)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Validate isolated Builder plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq 'esc-vb-header-navigate' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq 'esc_vb_nav_routes' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq 'id="esc-vb-device"' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq '<details id="esc-vb-inspector-details">' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq 'name="esc_vb_view"' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          if grep -Fq 'class="button esc-vb-size"' source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php; then
            echo 'Old viewport buttons unexpectedly remain' >&2
            exit 1
          fi
      - name: Upload only Builder plugin entry and byte-verify
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        shell: bash
        run: |
          set -euo pipefail
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD WC_URL; do test -n "${!v:-}"; done
          sudo apt-get update -qq
          sudo apt-get install -qq -y lftp
          export REMOTE_DIR="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url=os.environ['WC_URL']
          parsed=urlparse(url if '://' in url else 'https://'+url)
          if not parsed.hostname:raise SystemExit('Missing WordPress host')
          print('/domains/'+parsed.hostname+'/public_html/wp-content/plugins/esc-visual-builder')
          PY
          )"
          url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          protocol=os.environ.get('FTP_PROTOCOL') or 'ftp'
          if protocol not in ('ftp','ftps','sftp'): raise SystemExit('Invalid FTP protocol')
          print(protocol+'://'+quote(os.environ['FTP_USERNAME'],safe='')+
            ':'+quote(os.environ['FTP_PASSWORD'],safe='')+'@'+os.environ['FTP_SERVER'])
          PY
          )"
          lftp "$url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate no
          cd "$REMOTE_DIR"
          put source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php -o esc-visual-builder.php
          get esc-visual-builder.php -o /tmp/esc-builder-nav-remote.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php /tmp/esc-builder-nav-remote.php
          php -l /tmp/esc-builder-nav-remote.php
          echo 'Builder parent navigation bridge deployed with byte verification.'
      - name: WordPress REST smoke
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u=os.environ['WC_URL']
          print(urlparse(u if '://' in u else 'https://'+u).hostname)
          PY
          )"
          curl -fsS --connect-timeout 10 --max-time 35 "https://$host/wp-json/" >/dev/null
