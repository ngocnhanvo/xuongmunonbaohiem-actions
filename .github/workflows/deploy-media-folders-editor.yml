name: Deploy Media Folders Editor Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-media-folders-editor.yml'
      - 'requests/deploy-media-folders-editor.txt'
permissions:
  contents: read
concurrency:
  group: xuongmunonbaohiem-actions-wordpress-admin-performance-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve production WordPress target
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          values=[]
          for raw in os.environ.get('ENV_FILE','').splitlines():
              line=raw.strip().removeprefix('export ').strip()
              if line.startswith('WC_URL='):
                  val=line.split('=',1)[1].strip()
                  if len(val)>1 and val[0]==val[-1] and val[0] in ('"',"'"):val=val[1:-1]
                  values.append(val)
          if len(values)!=1:raise SystemExit('Missing/ambiguous WC_URL')
          p=urlsplit(values[0]);host=(p.hostname or '').lower()
          if p.scheme!='https' or not re.fullmatch(r'[a-z0-9.-]+',host) or '.' not in host or '..' in host or p.username or p.password or p.port not in (None,443) or p.path not in ('','/') or p.query or p.fragment:
              raise SystemExit('Unsafe backend URL')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('WP_HOST='+host+'\n')
              f.write('WP_BASE=https://'+host+'\n')
              f.write('REMOTE_MU=/domains/'+host+'/public_html/wp-content/mu-plugins\n')
          print('WordPress production target:',host)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify exact backend revision and targeted PHP tests
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          echo "Backend source SHA: $actual"
          test "$actual" = '27d658599f91504c9230233cc62c2ef1122c748e'
          p=source/wp-content/mu-plugins
          php -l "$p/disable-plugins-for-api.php"
          php "$p/tests/admin-performance-folders-media-editor.php"
          php "$p/tests/admin-performance-content-management-screens.php"
          php "$p/tests/admin-performance-media-library.php"
          php "$p/tests/admin-performance-custom-content-routing.php"
          echo 'MEDIA_FOLDERS_EDITOR_PREDEPLOY_PASS'
      - name: Install FTP client if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lftp >/dev/null 2>&1; then
            if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends lftp; then
              sudo apt-get update -qq
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends lftp
            fi
          fi
      - name: Upload exactly one MU plugin file; byte verify and lint remote copy
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$REMOTE_MU"
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) echo 'Unsupported FTP protocol'; exit 1;; esac
          src=source/wp-content/mu-plugins/disable-plugins-for-api.php
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$protocol://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 25
          set net:reconnect-interval-base 3
          set ssl:verify-certificate no
          cd "$REMOTE_MU"
          get "disable-plugins-for-api.php" -o "$RUNNER_TEMP/disable-plugins-for-api.previous.php"
          put "$src" -o ".disable-plugins-for-api.php.uploading"
          mv ".disable-plugins-for-api.php.uploading" "disable-plugins-for-api.php"
          get "disable-plugins-for-api.php" -o "$RUNNER_TEMP/disable-plugins-for-api.remote.php"
          bye
          LFTP
          cmp "$src" "$RUNNER_TEMP/disable-plugins-for-api.remote.php"
          php -l "$RUNNER_TEMP/disable-plugins-for-api.remote.php"
          echo 'MEDIA_FOLDERS_EDITOR_FTP_BYTE_MATCH_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Check authenticated WordPress editor loads Folders media assets
        shell: bash
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install -q requests
          python3 - <<'PY'
          import os,requests
          root=os.environ['WP_BASE']
          ses=requests.Session()
          ses.get(root+'/wp-login.php',timeout=35)
          dest=root+'/wp-admin/post.php?post=53325&action=edit'
          ses.post(root+'/wp-login.php',data={
              'log':os.environ['WP_ADMIN_USERNAME'],
              'pwd':os.environ['WP_ADMIN_PASSWORD'],
              'wp-submit':'Log In',
              'redirect_to':dest,
              'testcookie':'1',
          },timeout=40)
          response=ses.get(dest,timeout=45)
          if response.status_code!=200 or 'wp-login.php' in response.url:
              raise RuntimeError('Cannot open authenticated post editor')
          body=response.text
          if 'folders_media_options' not in body or 'folders-media' not in body:
              raise RuntimeError('Media folder UI missing in authenticated editor')
          print('FOLDERS_MEDIA_EDITOR_ASSETS_PASS')
          PY
      - name: WordPress backend public availability smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 35 "$WP_BASE/wp-json/" >/dev/null
          echo 'WORDPRESS_PUBLIC_REST_PASS' >> "$GITHUB_STEP_SUMMARY"
