name: Deploy Blue Sea Builder Bootstrap PHP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/esc-builder-bootstrap-php-deploy.txt']
permissions: {contents: read}
concurrency:
  group: esc-builder-bootstrap-php-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve WC_URL from ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          values = []
          for line in os.environ.get("ENV_FILE", "").splitlines():
              line = line.strip()
              if line.startswith("export "): line = line[7:].strip()
              if line.startswith("WC_URL="):
                  v = line.split("=", 1)[1].strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'): v = v[1:-1]
                  values.append(v)
          if len(values) != 1: raise SystemExit("ENV_FILE must contain exactly one WC_URL")
          url = urlsplit(values[0])
          host = (url.hostname or "").lower()
          if (url.scheme != "https" or not re.fullmatch(r"[a-z0-9.-]+", host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None, 443) or url.path not in ("", "/")
                  or url.query or url.fragment):
              raise SystemExit("Invalid backend WC_URL in ENV_FILE")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("WC_URL=https://" + host + "\n")
          print("Backend domain:", host)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Check exact source and PHP syntax before writing FTP
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git rev-parse HEAD
          php -l wp-content/plugins/esc-visual-builder/includes/change-index.php
          php -l wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          php wp-content/plugins/esc-visual-builder/tests/items-and-sections.test.php
          php wp-content/plugins/esc-visual-builder/tests/item-ui-script.test.php >/tmp/esc-ui-check.js
          node --check /tmp/esc-ui-check.js
          grep -Fq 'esc_vb_builder_layout_payload' wp-content/plugins/esc-visual-builder/includes/change-index.php
          grep -Fq 'esc_vb_builder_page_state' wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq 'bootstrap' wp-content/plugins/esc-visual-builder/esc-visual-builder.php
      - name: Upload only two PHP files with byte verification
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        shell: bash
        run: |
          set -euo pipefail
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD WC_URL; do test -n "${!v:-}"; done
          sudo apt-get update -qq
          sudo apt-get install -qq -y lftp
          export REMOTE_DIR="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value=os.environ['WC_URL']
          p=urlparse(value if '://' in value else 'https://'+value)
          if not p.hostname: raise SystemExit('Missing WordPress hostname')
          print('/domains/'+p.hostname+'/public_html/wp-content/plugins/esc-visual-builder')
          PY
          )"
          url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          proto=os.environ.get('FTP_PROTOCOL') or 'ftp'
          if proto not in ('ftp','ftps','sftp'): raise SystemExit('Unsupported FTP protocol')
          print(proto+'://'+quote(os.environ['FTP_USERNAME'],safe='')+':'+
                quote(os.environ['FTP_PASSWORD'],safe='')+'@'+os.environ['FTP_SERVER'])
          PY
          )"
          lftp "$url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          cd "$REMOTE_DIR"
          get includes/change-index.php -o /tmp/esc-index-original.php
          get esc-visual-builder.php -o /tmp/esc-builder-original.php
          put source/wp-content/plugins/esc-visual-builder/includes/change-index.php -o includes/change-index.php
          get includes/change-index.php -o /tmp/esc-index-deployed.php
          put source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php -o esc-visual-builder.php
          get esc-visual-builder.php -o /tmp/esc-builder-deployed.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-visual-builder/includes/change-index.php /tmp/esc-index-deployed.php
          cmp source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php /tmp/esc-builder-deployed.php
          php -l /tmp/esc-index-deployed.php
          php -l /tmp/esc-builder-deployed.php
          echo "Exact two-file PHP upload verified; no WordPress content writes."
      - name: Check WordPress REST health
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value=os.environ['WC_URL']
          p=urlparse(value if '://' in value else 'https://'+value)
          print(p.scheme+'://'+p.netloc)
          PY
          )"
          for attempt in 1 2 3; do
            if curl -fsS --connect-timeout 10 --max-time 30 "$base/wp-json/" >/dev/null; then
              echo "WordPress REST healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::WordPress REST health check failed"
          exit 1
