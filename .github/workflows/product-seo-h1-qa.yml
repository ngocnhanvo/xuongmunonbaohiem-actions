name: Blue Sea Product SEO H1 Integration QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-seo-h1-qa.yml'
      - 'requests/product-seo-h1-qa.txt'
permissions:
  contents: read
concurrency:
  group: blue-sea-product-seo-h1-qa
  cancel-in-progress: false
jobs:
  verify:
    name: Verify WordPress field and Astro H1 rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Blue Sea PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Checkout Blue Sea Astro development
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Record both source revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "WordPress: $(git -C php rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Astro: $(git -C astro rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only QA; this workflow does not deploy or merge." >> "$GITHUB_STEP_SUMMARY"
      - name: PHP lint and deterministic REST/ACF contract test
        shell: bash
        run: |
          set -euo pipefail
          php -l php/wp-content/mu-plugins/esc-product-seo-h1.php
          php -l php/tests/product-seo-h1-contract.php
          php -d zend.assertions=1 -d assert.exception=1 php/tests/product-seo-h1-contract.php
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml
      - name: Install Astro dependencies
        working-directory: astro
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Product heading and related UI regression
        working-directory: astro
        run: |
          pnpm exec vitest run \
            src/lib/seo/productH1.test.ts \
            src/lib/seo/legacyPageHeadings.test.ts \
            src/astro/pages/ProductDetailsPage.quote.test.ts \
            src/astro/pages/ProductDetailsPage.gallery.test.ts \
            src/lib/wordpress/products/getData.reload.test.ts
      - name: Build Astro development branch without deploy
        working-directory: astro
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$ENV_FILE"
          printf '%s\n' "$ENV_FILE" > .env
          pnpm run build-git
          node --check dist/server/entry.mjs
