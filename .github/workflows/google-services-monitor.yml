name: Blue Sea Google tracking QA status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requests/google-services-monitor.txt
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracking QA results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/google-services-ci.yml/runs?per_page=5" \
            --jq '{runs: [.workflow_runs[] | {id, status, conclusion, created_at, updated_at, html_url, head_sha}]}' \
            > reports/google-services-runs.json
          cat reports/google-services-runs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?per_page=4" \
            --jq '{runs: [.workflow_runs[] | {id, status, conclusion, created_at, updated_at, html_url, head_sha}]}' \
            > reports/google-services-verify-runs.json
          cat reports/google-services-verify-runs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/google-services-build.yml/runs?per_page=4" \
            --jq '{runs: [.workflow_runs[] | {id, status, conclusion, created_at, updated_at, html_url, head_sha}]}' \
            > reports/google-services-build-runs.json
          cat reports/google-services-build-runs.json
      - name: Store snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/google-services-runs.json reports/google-services-verify-runs.json reports/google-services-build-runs.json
          git commit -m "ci(tracking): snapshot tracking QA [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
