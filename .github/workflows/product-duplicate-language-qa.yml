name: Blue Sea Product Duplicate Language QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-duplicate-language-qa.yml'
      - 'requests/product-duplicate-language-qa.txt'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: backend
          persist-credentials: false
      - name: Check PHP and product multilingual regressions
        shell: bash
        run: |
          set -euo pipefail
          git -C backend rev-parse HEAD
          dir=backend/wp-content/mu-plugins
          php -l "$dir/esc-multilingual-admin.php"
          php -l "$dir/tests/product-duplicate-language-regression.php"
          php "$dir/tests/product-duplicate-language-regression.php"
          php "$dir/tests/multilingual-admin-regression.php"
          php "$dir/tests/multilingual-delete-regression.php"
          echo 'PRODUCT_DUPLICATE_LANGUAGE_QA_PASS'
