name: Inspect Production Agent Knowledge Source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-manufacturing-source-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check published WordPress production-process posts (read-only)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.parse,urllib.request,json
          found=[]
          for s in os.environ.get('ENV_FILE','').splitlines():
              s=s.strip().removeprefix('export ').strip()
              if s.startswith('WC_URL='):found.append(s.split('=',1)[1].strip().strip("\"'"))
          if len(found)!=1:raise RuntimeError('Missing/ambiguous WordPress origin')
          uri=urllib.parse.urlsplit(found[0])
          if uri.scheme!='https' or not uri.hostname:raise RuntimeError('Bad WordPress origin')
          root=uri.scheme+'://'+uri.netloc
          urls=[
            root+'/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'slug':'quy-trinh-san-xuat-non-bao-hiem','per_page':20}),
            root+'/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'slug':'quy-trinh-gia-cong-mu-bao-hiem-tai-xuong-blue-sea','per_page':20}),
            root+'/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'search':'quy trình sản xuất','per_page':35}),
            root+'/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'search':'quy trình lên hàng','per_page':35}),
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'BlueSea-Agent-Knowledge-Audit/1.0','Accept':'application/json','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as resp:
              data=json.load(resp)
              result=[{'id':x.get('id'),'slug':x.get('slug'),'title':x.get('title',{}).get('rendered','')[:150],
                'status':x.get('status'),'modified':x.get('modified')} for x in data]
              print(json.dumps({'search':urllib.parse.parse_qs(urllib.parse.urlsplit(url).query),
                'total':resp.headers.get('X-WP-Total'),'posts':result[:16]},ensure_ascii=False))
          PY
