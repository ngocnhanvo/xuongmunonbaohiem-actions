name: ESC Builder Two Pages Chrome QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/esc-builder-two-pages-browser.txt']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "):line=line[7:].strip()
              if line.startswith("WC_URL="):
                  v=line.split("=",1)[1].strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ("'",'"'):v=v[1:-1]
                  vals.append(v)
          if len(vals)!=1:raise SystemExit("Missing or duplicate WC_URL in ENV_FILE")
          parsed=urlsplit(vals[0]);host=(parsed.hostname or "").lower()
          if (parsed.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
              or "." not in host or ".." in host or parsed.username or parsed.password
              or parsed.port not in (None,443) or parsed.path not in ("","/")
              or parsed.query or parsed.fragment):raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as f:
              f.write("WC_URL=https://"+host+"\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify two published PostsPage previews in real Chrome (no writes)
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const origin = new URL(process.env.WC_URL).origin;
          const browser = await puppeteer.launch({
            headless:true,executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          const page = await browser.newPage();
          await page.setViewport({width:1440,height:900});
          let writes = 0;
          const errors = [];
          page.on('pageerror', e => errors.push(String(e.message).slice(0,120)));
          await page.setRequestInterception(true);
          page.on('request', req => {
            let route = '';try { route = new URL(req.url()).pathname; } catch {}
            if(req.method() === 'POST' && /\/esc-builder\/v1\/(save|delete|swap|insert|reorder|update|set)/.test(route)){
              writes++; req.abort('blockedbyclient');
            } else req.continue();
          });
          try {
            await page.goto(origin+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:65000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('wp-login.php'))throw Error('WordPress admin login failed');
            const results=[];
            for(const id of [53420,53415]){
              const started=Date.now();
              const url=origin+'/wp-admin/edit.php?post_type=page&page=esc-visual-builder&esc_vb_page='+id+'&esc_vb_view=desktop';
              const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:65000});
              if(res?.status()!==200)throw Error('Admin Page '+id+' HTTP '+res?.status());
              const handle=await page.waitForSelector('#esc-vb-frame',{timeout:18000});
              const frame=await handle.contentFrame();
              if(!frame)throw Error('Iframe missing for '+id);
              await frame.waitForSelector('main',{timeout:60000});
              const view=await frame.evaluate(()=>({
                hasMain:!!document.querySelector('main'),
                textLen:(document.querySelector('main')?.innerText||'').trim().length,
                headingCount:document.querySelectorAll('main h1').length,
                title:document.title,
                hasError:(document.body?.textContent||'').includes('Không thể mở bản xem trước')
              }));
              const entry={id,readyMs:Date.now()-started,hasMain:view.hasMain,textLen:view.textLen,
                headingCount:view.headingCount,hasError:view.hasError};
              console.log('BUILDER_CHROME_QA='+JSON.stringify(entry));
              if(!view.hasMain || view.textLen<100 || view.hasError)
                throw Error('Invalid rendered preview for '+id);
              results.push(entry);
            }
            if(writes)throw Error('Unexpected edit API write attempt: '+writes);
            console.log('BUILDER_TWO_PAGE_CHROME_PASS='+JSON.stringify({
              pages:results.map(x=>x.id),writes,errors:errors.slice(0,5)
            }));
          }finally{await browser.close();}
          JS
