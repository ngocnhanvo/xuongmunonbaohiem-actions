name: Blue Sea Preview Route Targeted QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/preview-route-ci.txt'

permissions:
  contents: read
concurrency:
  group: blue-sea-preview-targeted-qa
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate secrets
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify source and route guard
        working-directory: source
        run: |
          git rev-parse HEAD
          ! grep -qE 'getSharedWordPressData\(avas,\s*true' 'src/pages/preview/[...slug].astro'
          grep -q 'noindex' 'src/pages/preview/[...slug].astro'
          grep -q 'readLiveWordPressPreview' 'src/pages/preview/[...slug].astro'
          ! grep -q 'writeJsonFile' 'src/lib/wordpress/livePreview.ts'
          ! grep -q 'getSharedWordPressData' 'src/pages/preview/[...slug].astro'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Load environment
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > source/.env
      - name: Build and syntax check
        working-directory: source
        run: |
          set -euo pipefail
          pnpm run build-git
          node --check dist/server/entry.mjs
          test -s dist/client/data/cms-common.json
          test -s dist/client/data/cms-products.json
          test -s dist/client/data/page-trang-chu.json
          echo "Astro build includes self-contained CMS snapshot for preview."
      - name: Start standalone Astro and smoke all preview contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Simulate the exact FTP zip layout: deploy copies dist/* to server root.
          # Do not give the SSR process access to source/.cache or source/public.
          mkdir -p ftp-runtime
          ln -s "$(pwd)/dist/server" ftp-runtime/server
          ln -s "$(pwd)/dist/client" ftp-runtime/client
          cp .env ftp-runtime/.env
          test ! -e ftp-runtime/.cache
          export HOST=127.0.0.1 PORT=4379
          (cd ftp-runtime && node server/entry.mjs) > /tmp/blue-sea-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          status=""
          for attempt in {1..4}; do
            status="$(curl -sS --connect-timeout 5 --max-time 120 -D /tmp/preview.hdr -o /tmp/preview.html -w '%{http_code}' http://127.0.0.1:4379/preview/trang-chu || true)"
            echo "Attempt $attempt: preview HTTP $status"
            [ "$status" = 200 ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::SSR server stopped"
              tail -n 100 /tmp/blue-sea-preview.log
              exit 1
            fi
            sleep 3
          done
          if [ "$status" != 200 ]; then
            echo "::error::Preview remains HTTP $status (expected 200)"
            tail -n 100 /tmp/blue-sea-preview.log
            exit 1
          fi
          grep -qi 'blue sea' /tmp/preview.html
          grep -qi 'noindex' /tmp/preview.hdr
          grep -qi 'no-store' /tmp/preview.hdr
          grep -qi 'x-esc-preview-source: wordpress-live' /tmp/preview.hdr
          test ! -e ftp-runtime/.cache
          # A separate legacy URL rewrite may intercept unknown preview URLs.
          # Report that investigation separately; don't hide the main page's 200 result.
          missing="$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:4379/preview/esc-nonexistent-page-12345 || true)"
          if [ "$missing" != "404" ]; then
            echo "::warning::Unmatched preview path returned $missing instead of 404; inspect legacy redirects separately."
          fi
          denied="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:4379/esc-builder/preview/1)"
          test "$denied" = 403
          echo "PASS: live WP /preview/trang-chu=200; builder no-ticket=403; noindex/no-store and no runtime cache writes"
