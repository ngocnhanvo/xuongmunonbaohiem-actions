name: Deploy WooCommerce Category SEO Editor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/wordpress-product-category-seo-deploy.txt']
permissions:
  contents: read
concurrency:
  group: blue-sea-wp-category-seo-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Validate required credentials
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SOURCE_REPO_PAT FTP_SERVER FTP_USERNAME FTP_PASSWORD WP_ADMIN_URL; do
            test -n "${!name:-}"
          done
      - name: Checkout PHP repository master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Validate PHP SEO edit fields and API contract
        shell: bash
        run: |
          set -euo pipefail
          git -C source rev-parse HEAD
          php -l source/wp-content/plugins/github-trigger/product-categories/seo-fields.php
          php -l source/wp-content/plugins/github-trigger/product-categories/endpoint.php
          php -l source/wp-content/plugins/github-trigger/info/product-categories.php
          php -l source/tests/product-category-seo-fields.php
          php source/tests/product-category-seo-fields.php
          grep -Fq 'seoTitle' source/wp-content/plugins/github-trigger/product-categories/endpoint.php
          grep -Fq 'seoDescription' source/wp-content/plugins/github-trigger/product-categories/endpoint.php
      - name: Install lftp without unconditional apt update
        run: |
          set -euo pipefail
          if ! command -v lftp >/dev/null 2>&1; then
            if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends lftp; then
              sudo apt-get update -qq -y
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends lftp
            fi
          fi
          lftp --version >/dev/null
      - name: Upload only 3 category SEO PHP files and verify bytes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          remote_path="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          raw=os.environ['WP_ADMIN_URL'].strip()
          hostname=urlparse(raw if '://' in raw else 'https://'+raw).hostname
          if not hostname:raise SystemExit('Invalid WP_ADMIN_URL')
          print('/domains/'+hostname+'/public_html/wp-content/plugins/github-trigger')
          PY
          )"
          proto="${FTP_PROTOCOL:-ftp}"
          case "$proto" in ftp|ftps|sftp) ;; *) exit 1;; esac
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$proto://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          cd "$remote_path"
          cd product-categories
          put source/wp-content/plugins/github-trigger/product-categories/seo-fields.php -o seo-fields.php
          put source/wp-content/plugins/github-trigger/product-categories/endpoint.php -o endpoint.php
          get seo-fields.php -o /tmp/esc-cat-seo.remote.php
          get endpoint.php -o /tmp/esc-cat-endpoint.remote.php
          cd ../info
          put source/wp-content/plugins/github-trigger/info/product-categories.php -o product-categories.php
          get product-categories.php -o /tmp/esc-cat-info.remote.php
          bye
          LFTP
          cmp source/wp-content/plugins/github-trigger/product-categories/seo-fields.php /tmp/esc-cat-seo.remote.php
          cmp source/wp-content/plugins/github-trigger/product-categories/endpoint.php /tmp/esc-cat-endpoint.remote.php
          cmp source/wp-content/plugins/github-trigger/info/product-categories.php /tmp/esc-cat-info.remote.php
          php -l /tmp/esc-cat-seo.remote.php
          php -l /tmp/esc-cat-endpoint.remote.php
          php -l /tmp/esc-cat-info.remote.php
          echo "SEO category editor: uploaded 3 PHP files, byte-for-byte verified."
      - name: Read-only WordPress category API smoke test
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          raw=os.environ['WP_ADMIN_URL']
          origin=urllib.parse.urlparse(raw if '://' in raw else 'https://'+raw)
          url=origin.scheme+'://'+origin.netloc+'/wp-json/astro/v1/get-product-categories'
          req=urllib.request.Request(url,headers={'User-Agent':'ESC-Category-SEO-ReadOnlySmoke/1.0'})
          with urllib.request.urlopen(req,timeout=50) as resp:
            assert resp.status==200
            data=json.load(resp)
          assert isinstance(data,list) and len(data)>0,'No Woo product categories from WP'
          assert all(isinstance(x.get('seoTitle'),str) and isinstance(x.get('seoDescription'),str) for x in data),'Missing category SEO fields in API'
          print('CATEGORY_SEO_API_PASS='+json.dumps({'categories':len(data),'custom_titles':sum(bool(x['seoTitle']) for x in data),'custom_descriptions':sum(bool(x['seoDescription']) for x in data)}))
          PY
