name: ESC Builder Bootstrap API QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/esc-builder-bootstrap-readonly-qa.txt']
permissions: {contents: read}
concurrency:
  group: blue-sea-bootstrap-readonly-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "):line=line[7:].strip()
              if line.startswith("WC_URL="):
                  v=line.split("=",1)[1].strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ("'",'"'):v=v[1:-1]
                  vals.append(v)
          if len(vals)!=1:raise SystemExit("Missing or duplicate WC_URL in ENV_FILE")
          parsed=urlsplit(vals[0]);host=(parsed.hostname or "").lower()
          if (parsed.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
              or "." not in host or ".." in host or parsed.username or parsed.password
              or parsed.port not in (None,443) or parsed.path not in ("","/")
              or parsed.query or parsed.fragment):raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as f:
              f.write("WC_URL=https://"+host+"\n")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Compare authenticated Bootstrap with separate canonical REST contracts
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const origin=new URL(process.env.WC_URL).origin;
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage();
            await page.goto(origin+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:65000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('wp-login.php'))throw Error('WordPress admin login unavailable');
            const admin=await page.goto(origin+'/wp-admin/edit.php?post_type=page&page=esc-visual-builder',
              {waitUntil:'domcontentloaded',timeout:65000});
            if(admin?.status()!==200)throw Error('Builder admin unavailable');
            const src=await page.$eval('#esc-vb-frame',el=>el.getAttribute('src'));
            const url=new URL(src);
            const ticket=url.searchParams.get('ticket');
            const pageId=Number(url.pathname.split('/').at(-1));
            if(!ticket||!/^[a-f0-9]{64}$/.test(ticket)||!Number.isSafeInteger(pageId))
              throw Error('Builder iframe ticket unavailable');
            const route=async(name,payload={})=>{
              const r=await fetch(origin+'/wp-json/esc-builder/v1/'+name,{
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ticket,page_id:pageId,...payload}),
                cache:'no-store',signal:AbortSignal.timeout(40000)});
              if(!r.ok)throw Error(name+' HTTP '+r.status);
              return await r.json();
            };
            const t=Date.now();
            const combined=await route('verify',{bootstrap:true});
            const combinedMs=Date.now()-t;
            const old=await route('verify');
            const state=await route('page-state',{include_rules:true});
            const layout=await route('page-layout');
            if(combined.page_id!==old.page_id||combined.slug!==old.slug||
              combined.parent_origin!==old.parent_origin)
              throw Error('Legacy verify contract mismatch');
            if(!combined.bootstrap||!combined.bootstrap.manifest||!combined.bootstrap.layout)
              throw Error('Authenticated optional bootstrap absent');
            if(JSON.stringify(combined.bootstrap.manifest)!==JSON.stringify(state))
              throw Error('Manifest differs from canonical page-state');
            if(JSON.stringify(combined.bootstrap.layout)!==JSON.stringify(layout))
              throw Error('Layout differs from canonical page-layout');
            if(state.page_id!==pageId||layout.page.id!==pageId||
              !Array.isArray(state.tables)||!state.tables.length)
              throw Error('Page/ESC Table schema incomplete');
            if(!state.tables.every(x=>/^[a-f0-9]{64}$/.test(x.version)))
              throw Error('Invalid table version');
            console.log('ESC_BUILDER_BOOTSTRAP_QA_PASS='+JSON.stringify({
              authorized:true,contractsIdentical:true,pageId,tables:state.tables.length,
              combinedMs,mutations:0
            }));
          }finally{await browser.close();}
          JS
