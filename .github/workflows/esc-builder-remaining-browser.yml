name: ESC Builder remaining sections Chrome QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/esc-builder-remaining-browser.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify remaining section text in live Chrome (no writes)
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const origin = new URL(process.env.WP_ADMIN_URL).origin;
          const browser = await puppeteer.launch({
            headless:true,executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({width:1440,height:900,deviceScaleFactor:1});
            const attemptedSaves=[];
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message).slice(0,140)));
            page.on('request',req=>{
              try{
                if(new URL(req.url()).pathname.endsWith('/esc-builder/v1/save-text'))
                  attemptedSaves.push(req.method());
              }catch{}
            });
            async function navigate(url){
              let error;
              for(let attempt=1;attempt<=2;attempt++){
                try{
                  const response=await page.goto(url,{
                    waitUntil:'domcontentloaded',timeout:attempt===1?45000:65000
                  });
                  if(response?.status()===200)return;
                  error=Error('HTTP '+response?.status());
                }catch(e){error=e;}
                if(attempt===1)await new Promise(r=>setTimeout(r,1500));
              }
              throw error;
            }
            await navigate(origin+'/wp-login.php');
            await page.waitForSelector('#user_login',{timeout:20000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('wp-login.php'))throw Error('WP login failed');
            await navigate(origin+'/wp-admin/admin.php?page=esc-visual-builder');
            await page.waitForSelector('#esc-vb-frame',{timeout:20000});
            const frameHandle=await page.$('#esc-vb-frame');
            const frame=await frameHandle.contentFrame();
            if(!frame)throw Error('Missing Astro iframe');
            await frame.waitForSelector('[data-tablepress-preview="home_03"]',{timeout:90000});
            const initialUrl=frame.url();
            async function pickTable(tableId){
              const elem=await frame.$('[data-tablepress-preview="'+tableId+'"]');
              if(!elem)throw Error('Missing '+tableId);
              await elem.evaluate(el=>el.scrollIntoView({block:'center'}));
              await elem.click({delay:40});
              await page.waitForFunction(id=>
                (document.querySelector('#esc-vb-inspector')?.textContent||'')
                  .includes('"tableId": "'+id+'"'),{timeout:15000},tableId);
              await page.waitForFunction(()=>
                document.querySelector('#esc-vb-text-editor')?.style.display==='block' &&
                document.querySelector('#esc-vb-edit-title')?.disabled===false,
                {timeout:45000});
            }
            const audits=[];
            async function checkDraft(tableId,field,targetSelector){
              await pickTable(tableId);
              await page.waitForFunction(v=>Boolean(
                document.querySelector('#esc-vb-edit-row option[value="'+v+'"]')
              ),{timeout:14000},field);
              await page.select('#esc-vb-edit-row',field);
              const original=await page.$eval('#esc-vb-edit-title',e=>e.value);
              const disabled=await page.$eval('#esc-vb-edit-title',e=>e.disabled);
              const textMatches=await frame.$eval(targetSelector,(e,value)=>
                e.textContent.replace(/\\s+/g,' ').trim()===value.replace(/\\s+/g,' ').trim(),original).catch(()=>false);
              console.log('BUILDER_FIELD_DIAGNOSTIC='+JSON.stringify({
                tableId,field,disabled,sourceLength:original.length,renderMatchesSource:textMatches
              }));
              if(disabled)throw Error('Read-only editor field '+tableId+'/'+field);
              if(!await frame.$(targetSelector))throw Error('Missing target '+tableId+'/'+field);
              const marker=' __VB_QA_'+tableId+'_'+field.replace(':','_')+'__';
              await page.$eval('#esc-vb-edit-title',(el,value)=>{
                el.value=value;
                el.dispatchEvent(new Event('input',{bubbles:true}));
              },original+marker);
              await frame.waitForFunction(({selector,marker})=>
                (document.querySelector(selector)?.textContent||'').includes(marker),
                {timeout:12000},{selector:targetSelector,marker});
              if(!await page.$eval('#esc-vb-edit-save',el=>!el.disabled))
                throw Error('Draft did not enable Save for '+tableId+'/'+field);
              await page.click('#esc-vb-edit-cancel');
              await frame.waitForFunction(({selector,marker})=>
                !(document.querySelector(selector)?.textContent||'').includes(marker),
                {timeout:12000},{selector:targetSelector,marker});
              if(await page.$eval('#esc-vb-edit-title',el=>el.value)!==original)
                throw Error('Cancel did not restore '+tableId+'/'+field);
              if(frame.url()!==initialUrl)
                throw Error('Unexpected iframe reload after '+tableId+'/'+field);
              audits.push({tableId,field,draftVisible:true,cancelRestored:true});
            }
            // Already PASS on the preceding live run; avoid repeating it.
            // Already PASS on the preceding live run; avoid repeating it.
            // Already PASS on the preceding live run; avoid repeating it.
            // Already PASS on the preceding live run; avoid repeating it.
            await checkDraft('home_09','0:description','[data-tablepress-preview="home_09"] article:first-of-type p');
            await checkDraft('home_10','section_description','[data-tablepress-preview="home_10"] header p');
            await checkDraft('home_11','0:title','[data-tablepress-preview="home_11"] [data-certificate-track] article:first-of-type h3');
            await checkDraft('home_12','section','[data-tablepress-preview="home_12"] h2');
            if(attemptedSaves.length)throw Error('Live Chrome QA unexpectedly submitted Save');
            console.log('ESC_BUILDER_REMAINING_CHROME_PASS='+JSON.stringify({
              checked:audits,iframeReloaded:false,contentWrites:0,errors
            }));
          }finally{await browser.close();}
          JS
