name: Chrome QA - ESC Builder Ticket After Two Minutes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/esc-builder-ticket-aged-chrome.yml']
permissions:
  contents: read
concurrency:
  group: blue-sea-builder-ticket-aged-chrome
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "):line=line[7:].strip()
              if line.startswith("WC_URL="):
                  v=line.split("=",1)[1].strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ("'",'"'):v=v[1:-1]
                  vals.append(v)
          if len(vals)!=1:raise SystemExit("Missing or duplicate WC_URL in ENV_FILE")
          parsed=urlsplit(vals[0]);host=(parsed.hostname or "").lower()
          if (parsed.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
              or "." not in host or ".." in host or parsed.username or parsed.password
              or parsed.port not in (None,443) or parsed.path not in ("","/")
              or parsed.query or parsed.fragment):raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as f:
              f.write("WC_URL=https://"+host+"\n")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Wait past ticket TTL and test real item popup plus section order without writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const keys=['WC_URL','WP_ADMIN_USERNAME','WP_ADMIN_PASSWORD','CHROME_PATH'];
          for(const key of keys)if(!process.env[key])throw Error('Missing '+key);
          const wp=new URL(process.env.WC_URL).origin;
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,
            headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const audit={page:248,initialTicketExpired:false,
            popupAfterTTL:false,sectionAfterTTL:false,iframeStable:false,writeAttempts:0};
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1510,height:950});
            page.on('request',r=>{
              const route=new URL(r.url()).pathname;
              if(r.method()==='POST'&&
                 /\/esc-builder\/v1\/(?:insert-item|save-section-order|save-text|save-image|save-page-text|save-page-image)\/?$/.test(route))
                audit.writeAttempts++;
            });
            await page.goto(wp+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:60000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')
            ]);
            if(page.url().includes('/wp-login.php'))throw Error('WordPress login failed');
            await page.goto(wp+'/wp-admin/edit.php?post_type=page&page=esc-visual-builder&esc_vb_page=248',
              {waitUntil:'domcontentloaded',timeout:70000});
            const el=await page.waitForSelector('#esc-vb-frame',{timeout:25000});
            const frame=await el.contentFrame();
            if(!frame)throw Error('Builder iframe missing');
            await frame.waitForSelector('[data-tablepress-preview="home_00"]',{timeout:60000});
            const originalUrl=frame.url();
            const initialTicket=await page.$eval('#esc-vb-frame',el=>
              new URL(el.src).searchParams.get('ticket'));
            if(!/^[a-f0-9]{64}$/.test(initialTicket||''))throw Error('Missing initial ticket');
            console.log('AGE_TEST: initial Builder loaded; waiting beyond 120s ticket TTL');
            await new Promise(resolve=>setTimeout(resolve,133000));
            const expired=await page.evaluate(async token=>{
              const response=await fetch('/wp-json/esc-builder/v1/verify',{
                method:'POST',credentials:'same-origin',cache:'no-store',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({page_id:248,ticket:token})
              });
              const body=await response.json().catch(()=>({}));
              return response.status===403&&body.code==='expired_ticket';
            },initialTicket);
            audit.initialTicketExpired=expired;
            if(!expired)throw Error('The initial ticket did not expire; TTL regression cannot be verified');
            console.log('AGE_TEST: initial ticket confirmed expired; testing popup renewal');
            await frame.$eval('[data-tablepress-preview="home_00"]',node=>{
              node.addEventListener('click',event=>event.preventDefault(),{capture:true,once:true});
              node.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
            });
            await page.waitForFunction(()=>
              document.getElementById('esc-vb-item-panel')?.hidden===false&&
              (document.getElementById('esc-vb-item-context')?.textContent||'').startsWith('home_00'),
              {timeout:18000});
            const schemaPromise=page.waitForResponse(r=>
              r.request().method()==='POST'&&
              /\/esc-builder\/v1\/item-schema\/?$/.test(new URL(r.url()).pathname),
              {timeout:30000});
            await page.click('#esc-vb-item-new');
            const response=await schemaPromise;
            const body=await response.json().catch(()=>({}));
            if(!response.ok||body?.code)throw Error('Item schema failed after TTL: '+JSON.stringify({
              status:response.status(),code:body?.code,message:body?.message
            }));
            await page.waitForFunction(()=>document.querySelector(
              '#esc-vb-item-dialog[open] [data-esc-item-field="title"]')!==null,
              {timeout:15000});
            audit.popupAfterTTL=true;
            await page.click('#esc-vb-item-dismiss');
            await page.waitForFunction(()=>!document.getElementById('esc-vb-item-dialog')?.open,
              {timeout:8000});
            const sectionsPromise=page.waitForResponse(r=>
              r.request().method()==='POST'&&
              /\/esc-builder\/v1\/section-order\/?$/.test(new URL(r.url()).pathname),
              {timeout:30000});
            await page.click('#esc-vb-section-order-open');
            const orderResponse=await sectionsPromise;
            const order=await orderResponse.json().catch(()=>({}));
            if(!orderResponse.ok||order?.code||order?.items?.length!==14)
              throw Error('Section order rejected a refreshed ticket: '+JSON.stringify({
                status:orderResponse.status(),code:order?.code
              }));
            await page.waitForFunction(()=>
              document.querySelectorAll('#esc-vb-section-order-list li').length===14,
              {timeout:12000});
            audit.sectionAfterTTL=true;
            await page.click('#esc-vb-section-order-cancel');
            audit.iframeStable=frame.url()===originalUrl;
            console.log('AGE_TEST_FINAL_DIAGNOSTIC='+JSON.stringify({
              ...audit,
              initialPath:new URL(originalUrl).pathname,
              finalPath:new URL(frame.url()).pathname,
              // Periodic ticket maintenance can intentionally reconnect the
              // preview iframe; this must not mask a write attempt.
              previewReconnected:frame.url()!==originalUrl
            }));
            if(audit.writeAttempts!==0)
              throw Error('Unexpected WordPress content-write request');
            console.log('ESC_BUILDER_AGED_TICKET_CHROME_PASS='+JSON.stringify(audit));
          }finally{await browser.close();}
          JS
