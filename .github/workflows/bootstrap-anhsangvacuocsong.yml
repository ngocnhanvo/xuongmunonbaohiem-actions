name: Bootstrap anhsangvacuocsong repositories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-anhsangvacuocsong.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

      - name: Configure Git authentication
        shell: bash
        run: gh auth setup-git

      - name: Clone canonical branch snapshots without GitHub workflows
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "anhsangvacuocsong bootstrap"
          git config --global user.email "37570235+ngocnhanvo@users.noreply.github.com"

          copy_snapshot() {
            src_repo="$1"
            src_ref="$2"
            dst_repo="$3"
            dst_ref="$4"
            workdir="$5"

            rm -rf "$workdir"
            git clone --no-tags --single-branch --branch "$src_ref" "https://github.com/${src_repo}.git" "$workdir"
            cd "$workdir"
            rm -rf .github/workflows
            git checkout --orphan anhsang-bootstrap
            git rm -r --cached . >/dev/null 2>&1 || true
            git add -A
            git commit -m "Bootstrap snapshot ${dst_repo}:${dst_ref} from ${src_repo}:${src_ref} [skip ci]"
            git remote set-url origin "https://github.com/${dst_repo}.git"
            git push --force origin "HEAD:refs/heads/${dst_ref}"
            cd "$GITHUB_WORKSPACE"
          }

          copy_snapshot "ngocnhanvo/xuongmunonbaohiem-astro" "github" "ngocnhanvo/anhsangvacuocsong-astro" "github" "astro-github"
          copy_snapshot "ngocnhanvo/xuongmunonbaohiem-astro" "master" "ngocnhanvo/anhsangvacuocsong-astro" "master" "astro-master"
          copy_snapshot "ngocnhanvo/xuongmunonbaohiem-php" "master" "ngocnhanvo/anhsangvacuocsong-php" "master" "php-master"
          copy_snapshot "ngocnhanvo/xuongmunonbaohiem-actions" "main" "ngocnhanvo/anhsangvacuocsong-actions" "main" "actions-main"

      - name: Report
        run: echo "Canonical snapshots cloned without .github/workflows."