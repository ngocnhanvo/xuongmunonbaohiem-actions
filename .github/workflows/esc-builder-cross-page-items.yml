name: Chrome QA - Generic ESC Table Items Across Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/esc-builder-cross-page-items.txt']
permissions: {contents: read}
concurrency:
  group: blue-sea-cross-page-item-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          values=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "): line=line[7:].strip()
              if line.startswith("WC_URL="):
                  val=line.partition("=")[2].strip()
                  if len(val)>1 and val[0]==val[-1] and val[0] in ("'",'"'): val=val[1:-1]
                  values.append(val)
          if len(values)!=1: raise SystemExit("Exactly one WC_URL required in ENV_FILE")
          url=urlsplit(values[0]);host=(url.hostname or "").lower()
          if (url.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None,443) or url.path not in ("","/")
                  or url.query or url.fragment): raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as out:
              out.write("WC_URL=https://"+host+"\n")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Audit standard ESC Tables outside home Page and test read-only source picker
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const origin=new URL(process.env.WC_URL).origin;
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,
            headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const stats={pages:0,sections:0,attemptedTables:0,eligible:0,
            selectedPage:'',tableId:'',fallback:false,writes:0,samples:[]};
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1450,height:960});
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const url=new URL(req.url());
              if(req.method()==='POST'&&/\/esc-builder\/v1\/(?:swap-items|insert-item|delete-item|save-section-order|save-text|save-image|save-page-text|save-page-image)\/?$/.test(url.pathname)){
                stats.writes++;req.abort('blockedbyclient');
              }else req.continue();
            });
            await page.goto(origin+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:65000});
            await page.type('#user_login',process.env.WP_ADMIN_USERNAME);
            await page.type('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:45000}).catch(()=>{}),
              page.click('#wp-submit')]);
            if(page.url().includes('wp-login.php'))throw Error('WordPress login unavailable; no Builder test run');
            const base=origin+'/wp-admin/edit.php?post_type=page&page=esc-visual-builder';
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:65000});
            const options=await page.evaluate(()=>[...document.querySelectorAll('#esc-vb-page option')]
              .filter(e=>!e.selected).map(e=>({id:e.value,title:e.textContent.trim()})));
            // The old alphabetical first-five scan hit only cart/password
            // utility pages. Prioritize content Pages where ESC Table
            // sections may actually occur, then sample other non-utility Pages.
            const score=title=>{
              if(/^(?:giỏ hàng|bài viết|lịch sử mua hàng|đặt lại mật khẩu|quên mật khẩu|thanh toán|đăng nhập|đăng ký|hoàn tất)/i.test(title))return -10;
              if(/(?:về chúng tôi|giới thiệu|nhà xưởng|sản xuất|xưởng|dịch vụ|mũ bảo hiểm|quy trình|năng lực|sản phẩm|tin tức|khách hàng|liên hệ)/i.test(title))return 10;
              return 0;
            };
            const candidates=options.filter(p=>score(p.title)>=0)
              .sort((a,b)=>score(b.title)-score(a.title)||a.title.localeCompare(b.title,'vi'))
              .slice(0,12);
            stats.candidateTitles=candidates.map(x=>x.title);
            outer:for(const choice of candidates){
              await page.goto(base+'&esc_vb_page='+encodeURIComponent(choice.id),
                {waitUntil:'domcontentloaded',timeout:65000});
              stats.pages++;
              const el=await page.waitForSelector('#esc-vb-frame',{timeout:12000}).catch(()=>null);
              const frame=el?await el.contentFrame():null;
              if(!frame)continue;
              await frame.waitForSelector('body',{timeout:9000}).catch(()=>null);
              const snapshot=await frame.evaluate(()=>({
                url:location.pathname,
                title:document.title,
                htmlParts:document.querySelectorAll('[data-esc-builder-html-part]').length,
                rawTables:document.querySelectorAll('[data-tablepress-preview]').length,
                imageCount:document.querySelectorAll('main img').length,
                excerpt:(document.body?.innerText||'').trim().slice(0,160),
              })).catch(error=>({error:String(error).slice(0,100)}));
              stats.samples.push({page:choice.title,...snapshot});
              const tables=await frame.evaluate(()=>[...new Set(
                [...document.querySelectorAll('[data-tablepress-preview]')]
                  .map(e=>e.getAttribute('data-tablepress-preview')).filter(Boolean)
              )]);
              stats.sections+=tables.length;
              for(const id of tables.slice(0,5)){
                stats.attemptedTables++;
                try{
                  await frame.$eval('[data-tablepress-preview="'+id+'"]',node=>
                    node.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
                  await page.waitForFunction(id=>(
                    document.getElementById('esc-vb-item-context')?.textContent||''
                  ).startsWith(id),{timeout:4500},id);
                  const open=await page.$eval('#esc-vb-item-sort-open',
                    node=>!node.hidden&&!node.disabled).catch(()=>false);
                  if(!open)continue;
                  const response=page.waitForResponse(res=>res.request().method()==='POST'&&
                    /\/esc-builder\/v1\/item-schema\/?$/.test(new URL(res.url()).pathname),
                    {timeout:9000});
                  await page.click('#esc-vb-item-sort-open');
                  const schemaResponse=await response;
                  const schema=await schemaResponse.json().catch(()=>null);
                  if(!schemaResponse.ok()||!Array.isArray(schema?.items)||schema.items.length<2){
                    continue;
                  }
                  stats.eligible++;
                  await page.waitForFunction(()=>document.querySelectorAll(
                    '#esc-vb-item-sort-preview-list li button').length>=2,{timeout:14000});
                  await page.click('#esc-vb-item-sort-preview-list li:first-child button');
                  await page.waitForFunction(()=>(
                    document.getElementById('esc-vb-item-sort-status')?.textContent||''
                  ).includes('đích')||(
                    document.getElementById('esc-vb-item-sort-status')?.textContent||''
                  ).includes('Đã tô đỏ'),{timeout:12000});
                  const fallback=await page.$$eval(
                    '#esc-vb-item-sort-preview-list li button',els=>
                    els.length>=2&&els[1].getBoundingClientRect().width>0);
                  stats.fallback=fallback;
                  if(fallback){
                    await page.click('#esc-vb-item-sort-preview-list li:nth-child(2) button');
                  }else{
                    await frame.$eval('[data-tablepress-preview="'+id+'"] [data-esc-builder-row="1"],'+
                      '[data-tablepress-preview="'+id+'"] [data-esc-builder-image-row="1"]',
                      node=>node.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
                  }
                  await page.waitForFunction(()=>document.getElementById(
                    'esc-vb-item-sort-save')?.disabled===false,{timeout:12000});
                  await page.click('#esc-vb-item-sort-cancel');
                  stats.selectedPage=choice.title;stats.tableId=id;
                  break outer;
                }catch(e){
                  const cancel=await page.$('#esc-vb-item-sort-cancel');
                  if(cancel)await page.$eval('#esc-vb-item-sort-cancel',el=>el.click()).catch(()=>{});
                }
              }
            }
            // When no real secondary Page has an ESC Table, do an isolated
            // DOM-only fixture on the real, authenticated non-home preview.
            // This tests the deployed generic adapter without writing WP data.
            if(!stats.tableId && candidates.length){
              const fixtureCandidate=candidates.find(x=>stats.samples.some(s=>
                s.page===x.title && s.title && s.excerpt))||candidates[0];
              await page.goto(base+'&esc_vb_page='+encodeURIComponent(fixtureCandidate.id),
                {waitUntil:'domcontentloaded',timeout:65000});
              const iframe=await page.waitForSelector('#esc-vb-frame',{timeout:14000});
              const frame=await iframe.contentFrame();
              if(!frame)throw Error('Cross-page fixture cannot access Builder iframe');
              await frame.waitForSelector('body',{timeout:14000});
              const available=await frame.evaluate(()=>document.documentElement.classList.contains('esc-builder-preview'));
              if(!available){
                stats.syntheticFixture='SKIP: Page preview is not authorized or not rendered';
              }else{
                const fixtureId='qa_portable_nonhome';
                await frame.evaluate(id=>{
                  const root=document.createElement('section');
                  root.setAttribute('data-tablepress-preview',id);
                  root.setAttribute('data-qa-only','true');
                  const list=document.createElement('ul');
                  for(let i=0;i<3;i++){
                    const row=document.createElement('li');
                    row.setAttribute('data-esc-builder-row',String(i));
                    const img=document.createElement('img');
                    img.setAttribute('data-esc-builder-image-row',String(i));
                    img.setAttribute('data-esc-builder-image-field','image');
                    img.alt='QA only';img.src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    const text=document.createElement('span');
                    text.textContent=['A','B','C'][i];
                    row.append(img,text);list.append(row);
                  }
                  root.append(list);document.body.append(root);
                },fixtureId);
                const send=async payload=>page.evaluate(({payload,origin})=>{
                  document.getElementById('esc-vb-frame').contentWindow.postMessage(payload,origin);
                },{payload,origin:new URL(frame.url()).origin});
                const order=async()=>frame.evaluate(id=>[...document.querySelectorAll(
                  '[data-tablepress-preview="'+id+'"] li'
                )].map(n=>n.querySelector('span')?.textContent).join('|'),fixtureId);
                await send({type:'esc-vb-item-sort-preview',tableId:fixtureId,from:0,to:2,
                  items:[{title:'C'},{title:'B'},{title:'A'}],requestId:901});
                await frame.waitForFunction(id=>[...document.querySelectorAll(
                  '[data-tablepress-preview="'+id+'"] li span'
                )].map(x=>x.textContent).join('|')==='C|B|A',{timeout:7000},fixtureId);
                const bad=await frame.evaluate(id=>[...document.querySelectorAll(
                  '[data-tablepress-preview="'+id+'"] li'
                )].some((n,i)=>n.getAttribute('data-esc-builder-row')!==String(i)||
                  n.querySelector('img')?.getAttribute('data-esc-builder-image-row')!==String(i)),fixtureId);
                if(bad)throw Error('Generic swap left stale ESC Table row markers');
                await send({type:'esc-vb-item-sort-cancel',tableId:fixtureId,
                  items:[{title:'A'},{title:'B'},{title:'C'}],requestId:902});
                await frame.waitForFunction(id=>[...document.querySelectorAll(
                  '[data-tablepress-preview="'+id+'"] li span'
                )].map(x=>x.textContent).join('|')==='A|B|C',{timeout:7000},fixtureId);
                if(await order()!=='A|B|C')throw Error('Cancel did not restore generic rows');
                stats.syntheticFixture='PASS: generic swap/retag/cancel on '+fixtureCandidate.title;
                await frame.evaluate(id=>document.querySelector(
                  '[data-tablepress-preview="'+id+'"]')?.remove(),fixtureId);
              }
            }
            if(stats.writes)throw Error('Unexpected WordPress customer content mutation attempts');
            // If no eligible non-home Page was found, this is an evidence
            // gap, not proof of a broken generic adapter.
            console.log('ESC_CROSS_PAGE_ITEM_AUDIT='+JSON.stringify(stats));
            if(!stats.tableId){
              console.log('::warning::No qualifying static multi-row ESC Table found in prioritized non-home Pages; cross-page Chrome test was NOT exercised.');
              console.log('SKIP: cross-page item selection not functionally verified in production');
            }
          }finally{await browser.close();}
          JS
