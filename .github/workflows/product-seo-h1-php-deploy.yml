name: Deploy Product SEO H1 WordPress Field
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-seo-h1-php-deploy.yml'
permissions:
  contents: read
concurrency:
  group: blue-sea-product-seo-h1-php-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Resolve WC_URL from ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          values = []
          for line in os.environ.get("ENV_FILE", "").splitlines():
              line = line.strip()
              if line.startswith("export "): line = line[7:].strip()
              if line.startswith("WC_URL="):
                  v = line.split("=", 1)[1].strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'): v = v[1:-1]
                  values.append(v)
          if len(values) != 1: raise SystemExit("ENV_FILE must contain exactly one WC_URL")
          url = urlsplit(values[0])
          host = (url.hostname or "").lower()
          if (url.scheme != "https" or not re.fullmatch(r"[a-z0-9.-]+", host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None, 443) or url.path not in ("", "/")
                  or url.query or url.fragment):
              raise SystemExit("Invalid backend WC_URL in ENV_FILE")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("WC_URL=https://" + host + "\n")
          print("Backend domain:", host)
          PY
      - name: Validate deploy secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_PAT FTP_SERVER FTP_USERNAME FTP_PASSWORD WC_URL; do
            test -n "${!key:-}"
          done
      - name: Checkout PHP master (do not modify source)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Verify exact file, syntax, and REST/ACF behavior
        shell: bash
        run: |
          set -euo pipefail
          echo "PHP source: $(git -C php rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test -s php/wp-content/mu-plugins/esc-product-seo-h1.php
          php -l php/wp-content/mu-plugins/esc-product-seo-h1.php
          php -d zend.assertions=1 -d assert.exception=1 php/tests/product-seo-h1-contract.php
      - name: Upload only new MU-plugin via FTP and byte-verify
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y lftp
          export REMOTE_DIR="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          raw=os.environ['WC_URL']
          host=urlparse(raw if '://' in raw else 'https://'+raw).hostname
          if not host: raise SystemExit('Invalid WC_URL')
          print('/domains/'+host+'/public_html/wp-content/mu-plugins')
          PY
          )"
          ftp_url="$(python3 - <<'PY'
          from urllib.parse import quote
          import os
          proto=os.getenv('FTP_PROTOCOL') or 'ftp'
          if proto not in ('ftp','ftps','sftp'): raise SystemExit('Invalid protocol')
          print(proto+'://'+quote(os.environ['FTP_USERNAME'],safe='')+':'+quote(os.environ['FTP_PASSWORD'],safe='')+'@'+os.environ['FTP_SERVER'])
          PY
          )"
          lftp "$ftp_url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate no
          cd "$REMOTE_DIR"
          put php/wp-content/mu-plugins/esc-product-seo-h1.php -o esc-product-seo-h1.php
          get esc-product-seo-h1.php -o /tmp/esc-product-seo-h1-remote.php
          bye
          LFTP
          cmp php/wp-content/mu-plugins/esc-product-seo-h1.php /tmp/esc-product-seo-h1-remote.php
          php -l /tmp/esc-product-seo-h1-remote.php
          echo "WordPress SEO H1 MU-plugin FTP byte verification passed." >> "$GITHUB_STEP_SUMMARY"
      - name: WordPress REST field smoke test
        shell: bash
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          raw=os.environ['WC_URL']
          print(urlparse(raw if '://' in raw else 'https://'+raw).hostname)
          PY
          )"
          curl --retry 2 --retry-delay 3 -fsS --connect-timeout 10 --max-time 35 \
            "https://$host/wp-json/wp/v2/product?per_page=1&_fields=id,seo_h1" \
            -o /tmp/product-seo-h1-rest.json
          python3 - <<'PY'
          import json
          with open('/tmp/product-seo-h1-rest.json',encoding='utf-8') as f: data=json.load(f)
          assert isinstance(data,list) and data, "REST product list is empty/unavailable"
          assert isinstance(data[0],dict) and 'seo_h1' in data[0], "SEO H1 field missing in published REST product"
          print("REST product includes seo_h1; value may be empty until imported.")
          PY
