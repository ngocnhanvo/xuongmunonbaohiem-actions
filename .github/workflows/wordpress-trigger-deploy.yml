name: Deploy WordPress GitHub Trigger Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/wordpress-trigger-deploy.txt'

permissions:
  contents: read

concurrency:
  group: xuongmunonbaohiem-actions-wordpress-trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$WP_ADMIN_URL"

      - name: Checkout WordPress source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/xuongmunonbaohiem-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Validate trigger source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/github-trigger/vcs-build-trigger.php
          php -l wp-content/mu-plugins/esc-github-trigger-config.php
          grep -Fq "xuongmunonbaohiem-actions" wp-content/plugins/github-trigger/vcs-build-trigger.php
          grep -Fq "xuongmunonbaohiem-actions" wp-content/mu-plugins/esc-github-trigger-config.php
          grep -Fq "esc-github-trigger-token.php" wp-content/mu-plugins/esc-github-trigger-config.php

      - name: Prepare dedicated GitHub trigger token
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          token_b64="$(printf '%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          printf '%s\n' \
            '<?php' \
            "if (!defined('ABSPATH')) exit;" \
            "if (!defined('VCS_GH_TOKEN')) { define('VCS_GH_TOKEN', base64_decode('${token_b64}')); }" \
            > /tmp/esc-github-trigger-token.php
          unset token_b64
          chmod 600 /tmp/esc-github-trigger-token.php
          php -l /tmp/esc-github-trigger-token.php

      - name: Resolve WordPress FTP path
        id: wp_path
        shell: bash
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ["WP_ADMIN_URL"].strip()
          parsed = urlparse(raw if "://" in raw else "https://" + raw)
          if not parsed.hostname:
              raise SystemExit("Unable to resolve hostname from WP_ADMIN_URL")
          print(parsed.hostname)
          PY
          )"
          echo "remote_wp_content=/domains/${host}/public_html/wp-content" >> "$GITHUB_OUTPUT"
          echo "Resolved WordPress host for FTP deployment."

      - name: Deploy trigger runtime through FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          REMOTE_WP_CONTENT: ${{ steps.wp_path.outputs.remote_wp_content }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y lftp

          protocol="${FTP_PROTOCOL:-ftp}"
          export protocol FTP_SERVER FTP_USERNAME FTP_PASSWORD

          ftp_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          protocol = os.environ.get("protocol", "ftp")
          server = os.environ["FTP_SERVER"]
          username = quote(os.environ["FTP_USERNAME"], safe="")
          password = quote(os.environ["FTP_PASSWORD"], safe="")
          print(f"{protocol}://{username}:{password}@{server}")
          PY
          )"

          lftp "$ftp_url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 3
          set ssl:verify-certificate no

          cd "$REMOTE_WP_CONTENT/plugins/github-trigger"
          put "source/wp-content/plugins/github-trigger/vcs-build-trigger.php"
          get vcs-build-trigger.php -o /tmp/vcs-build-trigger.php

          cd "$REMOTE_WP_CONTENT/mu-plugins"
          put "source/wp-content/mu-plugins/esc-github-trigger-config.php"
          get esc-github-trigger-config.php -o /tmp/esc-github-trigger-config.remote.php

          cd "$REMOTE_WP_CONTENT"
          put "/tmp/esc-github-trigger-token.php"
          get esc-github-trigger-token.php -o /tmp/esc-github-trigger-token.remote.php

          bye
          LFTP

          cmp source/wp-content/plugins/github-trigger/vcs-build-trigger.php /tmp/vcs-build-trigger.php
          cmp source/wp-content/mu-plugins/esc-github-trigger-config.php /tmp/esc-github-trigger-config.remote.php
          cmp /tmp/esc-github-trigger-token.php /tmp/esc-github-trigger-token.remote.php
          rm -f /tmp/esc-github-trigger-token.php /tmp/esc-github-trigger-token.remote.php /tmp/esc-github-trigger-config.remote.php /tmp/vcs-build-trigger.php
          echo "WordPress GitHub trigger runtime and dedicated token deployed and byte-verified."
